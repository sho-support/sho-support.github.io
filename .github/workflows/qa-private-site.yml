name: Private customer site visual audit
on:
  push:
    branches: [main]
    paths: ['qa-trigger/private-site-*.txt']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  private-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Rebuild then check actual private site with cryptographic GitHub OIDC
        env:
          REBUILD_QA_SITE: 'true'
          QA_ACTION: ${{ contains(github.event.head_commit.message, '[QA-REVISION]') && 'revision' || 'rebuild' }}
        run: node tests/qa-private-site.cjs
