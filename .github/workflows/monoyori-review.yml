name: Publish isolated Monoyori review
on:
  push:
    branches: [monoyori/cloudflare-review]
    paths: [.github/workflows/monoyori-review.yml]
permissions:
  contents: read
concurrency:
  group: monoyori-review-deploy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: customer-hosting-preview
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout pinned Monoyori source, independently of customer hosting
        uses: actions/checkout@v4
        with:
          repository: sho-support/ai-trend-blog
          ref: 4f4c89b701da400bbd86e680e9cb0bb678644e54
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API credentials and require a new, isolated Worker
        run: |
          node --input-type=module <<'JS'
          const {CLOUDFLARE_API_TOKEN:token,CLOUDFLARE_ACCOUNT_ID:account}=process.env;
          if(!token||!account)throw Error('Existing Cloudflare credentials are not available to this deployment environment');
          const base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers';
          const opts={headers:{Authorization:'Bearer '+token}};
          const response=await fetch(base+'/subdomain',opts);
          if(!response.ok)throw Error('Cloudflare account check HTTP '+response.status);
          const data=await response.json();
          if(!data.success||data.result.subdomain!=='zodiac-suu')throw Error('Unexpected Cloudflare account subdomain');
          const existing=await fetch(base+'/scripts/sho-monoyori-review',opts);
          if(!existing.ok)throw Error('Cannot read isolated review Worker');
          const deployment=await fetch(base+'/scripts/sho-monoyori-review/deployments?per_page=1&page=1',opts);
          if(!deployment.ok)throw Error('Cannot verify review version');
          const active=(await deployment.json()).result.deployments[0].versions;
          if(active.length!==1||active[0].percentage!==100)throw Error('Review changed concurrently; refusing overwrite');
          console.log('Updating only the existing isolated Monoyori review Worker. API connected. Isolated review name available. Existing Workers, R2, DNS and paid settings remain outside this operation.');
          JS
      - name: Build only the three portals
        env:
          URL: https://sho-monoyori-review.zodiac-suu.workers.dev
        run: python portal-tools/build_commercial_site.py
      - name: Disable advertising navigation, analytics and search indexing for the review
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('dist')
          for p in root.rglob('*.html'):
              s=p.read_text()
              s=re.sub(r'<script\b[^>]*>.*?</script>',lambda m:'' if any(x in m.group(0) for x in ['googletagmanager.com','dataLayer','gtag(']) else m.group(0),s,flags=re.S)
              s=re.sub(r'<meta[^>]*name="robots"[^>]*>','',s)
              s=s.replace('</head>','<meta name="robots" content="noindex,nofollow"><script defer src="/portal-assets/review-mode.js"></script></head>')
              s=s.replace('<body>','<body><div style="background:#244a3b;color:white;padding:10px 18px;font-size:12px;text-align:center">公開確認版｜広告リンク・アクセス計測は停止中。掲載情報は取得時点のものです。</div>')
              p.write_text(s)
          (root/'robots.txt').write_text('User-agent: *\nDisallow: /\n')
          (root/'_headers').write_text('/*\n  X-Robots-Tag: noindex, nofollow\n  X-Content-Type-Options: nosniff\n  Referrer-Policy: strict-origin-when-cross-origin\n')
          (root/'portal-assets/review-mode.js').write_text('''(()=>{const blocked=a=>a.matches('[data-review-blocked],[data-buy],[data-deal-buy],[data-point-buy],[data-hotel]')||/hb\\.afl\\.rakuten|(?:px|rpx|ad)\\.a8\\.net/.test(a.href);const disable=()=>document.querySelectorAll('a').forEach(a=>{if(blocked(a)){a.href='#';a.dataset.reviewBlocked='true';a.setAttribute('aria-disabled','true');a.title='確認版では購入先への遷移を停止しています';}});document.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&blocked(a)){e.preventDefault();e.stopImmediatePropagation();}},true);disable();new MutationObserver(disable).observe(document.body,{childList:true,subtree:true});})();''')
          assert all('googletagmanager.com' not in p.read_text() for p in root.rglob('*.html'))
          config={'name':'sho-monoyori-review','compatibility_date':'2026-11-14','workers_dev':True,'preview_urls':False,'assets':{'directory':'./dist','html_handling':'auto-trailing-slash','not_found_handling':'404-page'}}
          Path('wrangler.monoyori.json').write_text(json.dumps(config))
          print('Review built: analytics off, ad navigation blocked, indexing off.')
          PY
      - name: Install isolated rendering tools
        run: |
          npm install --prefix /tmp/monoyori-qa --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          /tmp/monoyori-qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Check every category text block before deployment
        env:
          NODE_PATH: /tmp/monoyori-qa/node_modules
        run: |
          mkdir -p review-proof
          node <<'JS'
          const {chromium}=require('playwright');
          const {spawn}=require('child_process');
          const fs=require('fs');
          (async()=>{
            const server=spawn('python3',['-m','http.server','8765','--bind','127.0.0.1'],{cwd:'dist',stdio:'ignore'});
            let browser;
            try{
              for(let i=0;i<30;i++){try{if((await fetch('http://127.0.0.1:8765/products/')).ok)break;}catch(_){}await new Promise(r=>setTimeout(r,100));}
              browser=await chromium.launch({headless:true});
              const results=[];
              for(const width of [1920,1440,1024,768,600,390,320]){
                const page=await browser.newPage({viewport:{width,height:1000}});
                await page.goto('http://127.0.0.1:8765/products/');
                await page.waitForLoadState('networkidle');
                const result=await page.evaluate(()=>{
                  const cards=[...document.querySelectorAll('#category-grid .category-card')];
                  const issues=[];
                  for(const card of cards){
                    const title=card.querySelector('h2'),desc=card.querySelector('.category-context'),copy=card.querySelector('.category-copy');
                    if(!title||!desc||!copy){issues.push('missing text block');continue;}
                    const t=title.getBoundingClientRect(),d=desc.getBoundingClientRect(),c=copy.getBoundingClientRect();
                    if(d.top<t.bottom+3)issues.push(title.textContent+': text overlap');
                    if(t.top<c.top||d.bottom>c.bottom+1)issues.push(title.textContent+': text outside copy block');
                  }
                  const rows=new Map();
                  for(const card of cards){const r=card.getBoundingClientRect();const k=Math.round(r.top);if(!rows.has(k))rows.set(k,[]);rows.get(k).push(r.height);}
                  for(const heights of rows.values())if(Math.max(...heights)-Math.min(...heights)>1)issues.push('uneven row heights');
                  if(document.documentElement.scrollWidth>innerWidth)issues.push('horizontal overflow');
                  return {count:cards.length,issues};
                });
                if(result.count!==18||result.issues.length)throw Error(JSON.stringify({width,...result}));
                results.push({width,...result});
                if([1440,390,320].includes(width))await page.screenshot({path:'review-proof/category-layout-'+width+'.png',fullPage:true});
                await page.close();
              }

              for(const width of [1440,390,320]){
                const page=await browser.newPage({viewport:{width,height:1000}});
                await page.goto('http://127.0.0.1:8765/products/dumbbells.html');
                await page.waitForLoadState('networkidle');
                const check=await page.evaluate(()=>{
                  const cards=[...document.querySelectorAll('#catalog-grid .product-card')];
                  const issues=[];
                  for(const card of cards){
                    if(!card.querySelector('.review-summary,.review-count-only,.review-unverified'))issues.push('missing review state');
                    const ps=[...card.querySelectorAll('.review-highlights p')];
                    if(ps.length===2&&ps[1].getBoundingClientRect().top<ps[0].getBoundingClientRect().bottom)issues.push('overlapping reviews');
                  }
                  if(document.documentElement.scrollWidth>innerWidth)issues.push('overflow');
                  return {cards:cards.length,ratings:document.querySelectorAll('#catalog-grid .review-summary').length,highlights:document.querySelectorAll('#catalog-grid .review-highlights').length,issues};
                });
                await page.screenshot({path:'review-proof/dumbbell-reviews-'+width+'.png',fullPage:true});
                if(check.ratings<3||check.highlights<3||check.issues.length)throw Error(JSON.stringify({width,...check}));
                results.push({page:'dumbbells',width,...check});
                await page.close();
              }
              fs.writeFileSync('review-proof/category-layout.json',JSON.stringify(results,null,2));console.log(JSON.stringify(results));
            }finally{if(browser)await browser.close();server.kill();}
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Deploy static assets to the isolated review Worker
        run: npx --yes wrangler@4.160.0 deploy --config wrangler.monoyori.json
      - name: Verify public pages and record the actual response
        continue-on-error: true
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import json
          base='https://sho-monoyori-review.zodiac-suu.workers.dev'
          results=[]
          for path,word in [('/products/','モノより'),('/deals/','ポイント倍率'),('/events/','イベント')]:
              with urlopen(base+path,timeout=30) as r:
                  s=r.read().decode();assert r.status==200 and word in s and 'noindex,nofollow' in s
                  results.append({'url':r.url,'status':r.status})
          Path('review-proof.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False))
          PY
      - name: Inspect rendered photos, ratings and mobile overflow
        env:
          NODE_PATH: /tmp/monoyori-qa/node_modules
        run: |
          mkdir -p review-proof
          node <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const browser=await chromium.launch({headless:true});const reports=[];
          for(const width of [1440,390]){const page=await browser.newPage({viewport:{width,height:1000}});
          for(const portal of ['products','deals','events']){await page.goto('https://sho-monoyori-review.zodiac-suu.workers.dev/'+portal+'/');await page.waitForTimeout(2500);const result=await page.evaluate(()=>({overflow:document.documentElement.scrollWidth>innerWidth,ratings:document.querySelectorAll('.review-summary').length,categories:document.querySelectorAll('#category-grid .category-card').length,images:[...document.images].map(x=>({url:x.currentSrc,loaded:x.complete&&x.naturalWidth>0}))}));reports.push({width,portal,...result});if(result.overflow)throw Error('Horizontal overflow '+portal+' '+width);if(portal==='products'&&result.categories<6)throw Error('Missing shopping categories');await page.screenshot({path:'review-proof/'+portal+'-'+width+'.png',fullPage:true});}await page.close();}
          require('fs').writeFileSync('review-proof/render.json',JSON.stringify(reports,null,2));console.log(JSON.stringify(reports));await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Save public review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monoyori-public-review-proof
          path: |
            review-proof.json
            review-proof/
          retention-days: 7
