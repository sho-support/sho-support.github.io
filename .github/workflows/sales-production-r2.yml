name: HP production R2 scoped connection check
on:
  push:
    branches: [architecture/sales-cloudflare]
    paths:
      - 'sales-hosting/production-r2-check/**'
      - 'sales-hosting/verify-production-r2.mjs'
      - 'sales-hosting/tests/production-r2-check.test.mjs'
      - '.github/workflows/sales-production-r2.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: customer-hosting-v2/package-lock.json
      - run: npm ci --prefix customer-hosting-v2 --ignore-scripts --no-audit --no-fund
      - run: node --test sales-hosting/tests/production-r2-check.test.mjs
      - name: Check the isolated function types
        run: |
          ln -s customer-hosting-v2/node_modules node_modules
          cd customer-hosting-v2
          npx --yes deno@2.9.6 check --config deno.qa.json --no-remote --no-lock ../supabase/functions/_shared/edge-runtime.d.ts ../sales-hosting/production-r2-check/index.ts
  live:
    needs: contract
    if: ${{ contains(github.event.head_commit.message, '[verify-production-r2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: customer-hosting-preview
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production S3 read/write, cleanup, preview denial and private bucket metadata
        run: node sales-hosting/verify-production-r2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-production-r2-connectivity
          path: test-results/sales-production-r2-connectivity.json
          retention-days: 7
