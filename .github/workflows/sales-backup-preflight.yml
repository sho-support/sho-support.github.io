name: HP backup read-only connection preparation
on:
  push:
    branches: [architecture/sales-cloudflare]
    paths:
      - 'sales-hosting/backup/**'
      - 'sales-hosting/verify-backup-connection.mjs'
      - 'sales-hosting/tests/backup-preflight.test.mjs'
      - '.github/workflows/sales-backup-preflight.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sales-hosting/tests/backup-preflight.test.mjs
      - run: node --check sales-hosting/verify-backup-connection.mjs
  live:
    needs: contract
    if: ${{ contains(github.event.head_commit.message, '[verify-hp-backup-connection]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: customer-hosting-v2/package-lock.json
      - run: npm ci --prefix customer-hosting-v2 --ignore-scripts --no-audit --no-fund
      - name: Verify TLS and a read-only transaction; never export database rows or backup files
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          SUPABASE_BACKUP_DB_PASSWORD: ${{ secrets.SUPABASE_BACKUP_DB_PASSWORD }}
        run: node sales-hosting/verify-backup-connection.mjs
