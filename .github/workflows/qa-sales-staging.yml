name: Sales UI regression (3 plans x 3 cases)
on:
  push:
    branches: [netlify-sales-staging]
    paths:
      - 'website-*.html'
      - 'website-*.js'
      - 'admin/**'
      - 'scripts/build-sales-netlify.mjs'
      - 'tests/qa-sales-checkout.cjs'
      - 'tests/qa-public-backend.cjs'
      - '.github/workflows/qa-sales-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/build-sales-netlify.mjs
      - run: node tests/qa-sales-checkout.cjs
      - run: node tests/qa-public-backend.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sales-nine-cases-screenshots
          path: test-results/sales
          if-no-files-found: ignore
          retention-days: 7
