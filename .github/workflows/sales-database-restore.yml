name: HP private SQL snapshot restore rehearsal
on:
  push:
    branches: [architecture/sales-cloudflare]
    paths:
      - 'sales-hosting/backup/restore-request.json'
      - 'sales-hosting/verify-database-restore.mjs'
      - '.github/workflows/sales-database-restore.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sales-hosting/tests/backup-preflight.test.mjs sales-hosting/tests/restore-roles.test.mjs sales-hosting/tests/private-delivery.test.mjs
      - run: node --check sales-hosting/verify-database-restore.mjs
  rehearsal:
    needs: contract
    if: ${{ contains(github.event.head_commit.message, '[verify-hp-database-restore]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    concurrency:
      group: hp-private-sql-restore-rehearsal
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: customer-hosting-v2/package-lock.json
      - run: npm ci --prefix customer-hosting-v2 --ignore-scripts --no-audit --no-fund
      - name: Fetch the pinned official restore image without project credentials
        run: docker pull supabase/postgres@sha256:8630950b489ecc70563300180287a98c192a4a48f5ae00b4febdaeea1abe85de
      - name: Restore a real SQL snapshot only inside a disposable isolated database
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          SUPABASE_BACKUP_ACCESS_TOKEN: ${{ secrets.SUPABASE_BACKUP_ACCESS_TOKEN }}
          HP_SQL_BACKUP_RETAIN: ${{ contains(github.event.head_commit.message, '[retain-hp-sql-backup]') && 'true' || 'false' }}
        run: node sales-hosting/verify-database-restore.mjs
