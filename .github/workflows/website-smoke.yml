name: Website Support Quality
on:
  push:
    branches: [main]
    paths:
      - 'website-*.html'
      - 'website-*.js'
      - 'website-theme.css'
      - 'admin/**'
      - 'tests/**'
      - '.github/workflows/website-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/website-http.log 2>&1 &
          sleep 2
      - name: Verify public pages on mobile and desktop
        run: node tests/website-smoke.cjs
