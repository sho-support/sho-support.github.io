name: Final real-checkout QA
on:
  push:
    branches: [main]
    paths: ['qa-trigger/live-orders-20261031-*.txt']
permissions:
  contents: read
concurrency:
  group: one-time-live-orders-20261031
  cancel-in-progress: false
jobs:
  live-orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test real checkout three times on public site
        run: node tests/qa-real-orders.cjs
