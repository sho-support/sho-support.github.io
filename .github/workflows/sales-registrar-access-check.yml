name: HP Cloudflare Registrar access check
on:
  push:
    branches: [architecture/sales-cloudflare]
    paths: ['.github/workflows/sales-registrar-access-check.yml']
permissions: {}
jobs:
  registrar-access:
    if: ${{ github.repository == 'sho-support/sho-support.github.io' && contains(github.event.head_commit.message, '[check-sales-registrar]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    environment: customer-hosting-preview
    steps:
      - name: Compare saved Workers and Registrar access
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID?.trim();
          const token = process.env.CLOUDFLARE_API_TOKEN?.trim();
          const domain = 'sho-websites.com';
          if (!/^[a-f0-9]{32}$/.test(account ?? '') || !token) {
            console.log('Cloudflare Actions secrets are unavailable to this job.');
            process.exit(1);
          }

          async function read(path, body) {
            try {
              const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, {
                method: body ? 'POST' : 'GET',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body: body ? JSON.stringify(body) : undefined,
                redirect: 'error',
                signal: AbortSignal.timeout(10000),
              });
              return { status: response.status, data: await response.json().catch(() => null) };
            } catch {
              return { status: null, data: null };
            }
          }

          const workers = await read('/workers/subdomain');
          const targetVerified = workers.data?.success === true && workers.data.result?.subdomain === 'zodiac-suu';
          const proof = { workers_http_status: workers.status, target_account_verified: targetVerified };
          if (targetVerified) {
            // The documented domain-check POST checks availability without reserving or buying a domain.
            const registrar = await read('/registrar/domain-check', { domains: [domain] });
            const data = registrar.data;
            const domains = data?.result?.domains;
            const candidate = Array.isArray(domains) ? domains.find(item => item?.name === domain) : undefined;
            const errors = Array.isArray(data?.errors) ? data.errors : [];
            const price = candidate?.pricing;
            const safePrice = value => typeof value === 'string' && /^\d{1,5}\.\d{2}$/.test(value) ? value : null;
            proof.registrar_http_status = registrar.status;
            proof.registrar_success = data?.success === true;
            proof.registrar_error_codes = errors.slice(0, 3).map(error => error?.code).filter(Number.isSafeInteger);
            proof.registrable = typeof candidate?.registrable === 'boolean' ? candidate.registrable : null;
            if (price?.currency === 'USD') {
              proof.registration_cost_usd = safePrice(price.registration_cost);
              proof.renewal_cost_usd = safePrice(price.renewal_cost);
            }
          }
          console.log(JSON.stringify(proof));
          NODE
