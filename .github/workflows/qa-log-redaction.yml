name: Remove historical private QA screenshot logs
on:
  push:
    branches: [main]
    paths: ['qa-trigger/redact-historical-private-logs.txt']
permissions:
  actions: write
  contents: read
jobs:
  redact:
    if: ${{ github.repository == 'sho-support/sho-support.github.io' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner='sho-support',repo='sho-support.github.io';
            const cutoff=Date.parse('2026-11-05T05:30:30Z');
            const all=await github.paginate(github.rest.actions.listWorkflowRuns,{
              owner,repo,workflow_id:'qa-private-site.yml',per_page:100
            });
            let removed=0,failed=0,skipped=0;
            for(const run of all){
              if(Date.parse(run.created_at)>cutoff || run.status!=='completed'){skipped++;continue}
              try{
                await github.rest.actions.deleteWorkflowRunLogs({owner,repo,run_id:run.id});
                removed++;
              }catch(e){
                if(e.status===404){skipped++;continue}
                failed++;core.warning('Unable to delete historical QA logs for run '+run.id+': HTTP '+e.status);
              }
            }
            core.info('PRIVATE_QA_HISTORIC_LOG_REDACTION '+JSON.stringify({removed,failed,skipped}));
            await core.summary.addHeading('Historical private QA log redaction')
              .addRaw('Log archives removed: '+removed+'; failed: '+failed+'; skipped: '+skipped).write();
            if(failed)core.setFailed('Some historical screenshot logs could not be deleted');
