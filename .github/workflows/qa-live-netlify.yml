name: Anonymous Netlify public access check
on:
  push:
    branches: [netlify-sales-staging]
    paths:
      - 'tests/qa-live-netlify.cjs'
      - '.github/workflows/qa-live-netlify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/qa-live-netlify.cjs
