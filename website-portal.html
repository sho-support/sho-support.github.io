*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.65}.wrap{width:min(calc(100% - 24px),820px);margin:auto}.head{padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.1)}.brand{font-weight:950}.logout{border:1px solid rgba(255,255,255,.14);border-radius:9px;background:#111;color:#ccc;padding:8px 10px}.hero{padding:34px 0 16px}.hero h1{margin:0;font-size:clamp(2.1rem,8vw,3.8rem);line-height:1}.hero p{color:#c8c8c8}.sites{display:grid;gap:7px;padding-bottom:40px}.card{padding:0;border:1px solid rgba(217,174,92,.24);border-radius:11px;background:#0d0d0f;overflow:hidden}.card>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 13px;min-height:48px}.card>summary::-webkit-details-marker{display:none}.card>summary:focus-visible{outline:2px solid #d9ae5c;outline-offset:-3px}.card>summary .siteid{flex-shrink:0}.card>summary h2{flex:1;min-width:0;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:.89rem;margin:0}.card>summary .status{flex-shrink:0}.card>summary .fold-icon{color:#d9ae5c;font-size:1rem;font-weight:900}.card[open]>summary .fold-icon{transform:rotate(45deg)}.card .card-body{padding:13px;border-top:1px solid rgba(255,255,255,.1)}.siteid{color:#d9ae5c;font-size:.69rem;font-weight:900}.card h2{margin:3px 0 5px;font-size:1.05rem}.status{display:inline-flex;padding:4px 7px;border:1px solid rgba(198,31,56,.45);border-radius:999px;color:#f0c7ce;font-size:.65rem;font-weight:900}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:#151515;color:#fff;text-decoration:none;font-size:.74rem;font-weight:900}.btn.primary{background:#c51f38;border-color:#c51f38}.msg{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:#0d0d0f;color:#aaa}.hidden{display:none}@media(max-width:560px){.actions{grid-template-columns:1fr}.card>summary{gap:7px;padding:9px}.card>summary h2{font-size:.78rem}.card>summary .siteid{font-size:.6rem}.card>summary .status{font-size:.57rem;padding:3px 5px}}
