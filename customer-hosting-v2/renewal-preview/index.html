<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>公開維持の更新・画面見本</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #11100f;
      color: #f8f2eb;
      font: 16px/1.65 system-ui, sans-serif;
    }
    main { max-width: 760px; margin: auto; padding: 24px 16px 48px; }
    h1 { margin: 12px 0 4px; font-size: clamp(1.45rem, 4vw, 2rem); }
    h2 { margin: 0 0 8px; font-size: 1.12rem; }
    p { margin: 6px 0; color: #d1c4b7; }
    section {
      margin-top: 24px;
      padding: clamp(14px, 4vw, 24px);
      border: 1px solid #4d3d30;
      border-radius: 14px;
      background: #1b1713;
    }
    .sample { color: #ffc08c; font-weight: 700; }
    .dates {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .dates div { padding: 12px; background: #11100f; border-radius: 8px; }
    dt { color: #d1c4b7; font-size: .84rem; }
    dd { margin: 0; font-weight: 750; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button, select {
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid #9e6c4a;
      border-radius: 8px;
      background: #211b16;
      color: #f8f2eb;
      font: inherit;
    }
    button[aria-pressed="true"] { background: #ffc08c; color: #24170d; font-weight: 750; }
    button:disabled { opacity: .66; }
    label { display: grid; gap: 6px; }
    .agreement { display: flex; align-items: flex-start; gap: 8px; min-height: 44px; margin: 12px 0; }
    .agreement input { margin-top: 6px; }
    select { width: 100%; }
    @media (max-width: 480px) {
      .dates { grid-template-columns: 1fr; }
      .choices button { width: 100%; }
    }
  </style>
</head>
<body>
<main>
  <p class="sample">操作見本・架空サイト</p>
  <h1>公開維持の更新</h1>
  <p>サンプルバンド公式サイト</p>
  <section aria-labelledby="period">
    <h2 id="period">ご契約期間</h2>
    <dl class="dates">
      <div><dt>満了日時</dt><dd id="expires"></dd></div>
      <div><dt>継続の選択締切</dt><dd id="deadline"></dd></div>
    </dl>
    <p id="fee"></p>
    <div class="choices" role="group" aria-label="継続の選択">
      <button type="button" data-choice="continue" aria-pressed="false" disabled>継続を希望する</button>
      <button type="button" data-choice="decline" aria-pressed="false" disabled>継続しない</button>
    </div>
    <p id="choice" role="status"></p>
    <p id="payment"></p>
  </section>
  <section aria-labelledby="card-renewal">
    <h2 id="card-renewal">クレジットカードで自動更新</h2>
    <p id="card-terms"></p>
    <div id="card-registration" hidden>
      <label class="agreement"><input id="card-consent" type="checkbox" aria-describedby="card-terms">年払いの自動更新に同意します</label>
      <button id="card-enroll" type="button" disabled>カード自動更新を登録（見本）</button>
    </div>
    <button id="card-stop" type="button" hidden>次回の自動請求を停止（見本）</button>
    <p id="card-status" role="status"></p>
  </section>
  <section aria-labelledby="publication">
    <h2 id="publication">契約期間と引き渡し</h2>
    <p id="access"></p>
    <p id="retention" hidden></p>
    <p id="restoration-price"></p>
  </section>
  <section>
    <label for="scenario">見本の日時・入金状態</label>
    <select id="scenario">
      <option value="before">案内開始前</option>
      <option value="open" selected>選択受付中</option>
      <option value="locked">満了24時間前</option>
      <option value="expiry">満了時刻（入金確認なし）</option>
      <option value="paid">次の契約分の入金確認済み</option>
      <option value="card-processing">請求予定時刻（決済確認中）</option>
      <option value="card-review">請求予定から3日経過（確認中）</option>
      <option value="card-failed">カード決済の失敗を確認</option>
      <option value="card-paid">カード決済の成功を確認</option>
      <option value="retained">満了から30日経過</option>
      <option value="purged">復元受付期限に到達</option>
    </select>
  </section>
</main>
<script type="module">
import { HOSTING_OFFER, HOSTING_RESTORATION, restorationPrice } from '../../supabase/functions/_shared/hosting-offer.mjs';
import { renewalWindow, selectRenewal } from './policy.mjs';
import { applyCardReceipt, cardConfirmationDays, cardRenewalTerms, cardRenewalWindow, enrollCardRenewal, recordCardFailure, stopCardRenewal } from './card-renewal.mjs';

const expiresAt = Date.parse('2027-11-20T18:00:00+09:00');
const expectedRenewalEnd = Date.parse('2028-11-20T18:00:00+09:00');
let term = { expiresAt, expectedRenewalEnd, choice: null };
let registrationCount = 0;
const day = 24 * 60 * 60 * 1000;
const scenarios = {
  before: { now: expiresAt - 31 * day },
  open: { now: expiresAt - 14 * day },
  locked: { now: expiresAt - day },
  expiry: { now: expiresAt },
  paid: { now: expiresAt, confirmedUntil: expectedRenewalEnd },
  'card-processing': { now: expiresAt },
  'card-review': { now: expiresAt + cardConfirmationDays * day },
  'card-failed': { now: expiresAt + 60 * 60 * 1000, cardResult: 'failed' },
  'card-paid': { now: expiresAt + 60 * 60 * 1000, cardResult: 'paid' },
  retained: { now: expiresAt + HOSTING_RESTORATION.handover_days * day },
  purged: { now: expiresAt + HOSTING_RESTORATION.request_days * day },
};
const formatter = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', dateStyle: 'medium', timeStyle: 'short' });
const date = (ms) => formatter.format(ms) + '（日本時間）';
const scenario = document.getElementById('scenario');
const buttons = [...document.querySelectorAll('[data-choice]')];
const cardConsent = document.getElementById('card-consent');
const cardEnroll = document.getElementById('card-enroll');
const cardStop = document.getElementById('card-stop');
const text = (id, value) => { document.getElementById(id).textContent = value; };

function render() {
  const { now, confirmedUntil } = scenarios[scenario.value];
  const effectiveTerm = confirmedUntil && !term.card ? { ...term, confirmedUntil } : term;
  const view = renewalWindow(effectiveTerm, now);
  const card = cardRenewalWindow(effectiveTerm, now);
  text('expires', date(view.paidUntil));
  text('deadline', view.paymentConfirmed ? '次回の更新時に案内します' : date(view.locksAt));
  text('fee', '継続の料金は ' + HOSTING_OFFER.renewal_fee_jpy.toLocaleString('ja-JP') + '円／年（税込）です。');
  for (const button of buttons) {
    button.disabled = !card.canChooseBank;
    button.setAttribute('aria-pressed', String((view.paymentConfirmed ? 'continue' : view.choice) === button.dataset.choice));
  }
  const labels = { continue: '継続を希望する', decline: '継続しない' };
  text('choice', view.paymentConfirmed ? '入金を確認し、継続が確定しました。' : '選択 ' + (labels[view.choice] ?? '未選択'));
  if (view.paymentConfirmed) text('payment', '更新後の満了日時 ' + date(view.paidUntil));
  else if (card.status === 'scheduled' || card.status === 'failed') text('payment', 'カードでの支払い状況をご確認ください。');
  else if (now < view.opensAt) text('payment', date(view.opensAt) + 'から選択できます。');
  else if (!view.canChoose) text('payment', '管理画面での変更受付は終了しました。');
  else if (view.choice === 'decline') text('payment', '満了時刻に公開が終了します。締切まではこの画面で変更できます。');
  else if (view.choice === 'continue') text('payment', '見積りをご確認ください。入金確認後に継続が確定します。');
  else text('payment', '継続の希望を選んでください。');
  if (card.holdForConfirmation) text('access', card.status === 'failed' ? '現在は公開を続けています。' : '確認中は公開を続けます。');
  else if (card.needsConfirmationReview) text('access', '決済の確認結果に応じて公開状況を更新します。');
  else if (card.awaitingCardPayment) text('access', 'お支払いの確認が済むまで、サイトを一時非公開にしています。');
  else if (view.termAllowsPublication) text('access', '公開期間中です。');
  else text('access', '満了のためサイトは非公開です。管理画面で引き渡しや復元の受付を確認できます。');
  const retention = document.getElementById('retention');
  retention.hidden = view.termAllowsPublication || card.awaitingCardPayment;
  document.getElementById('restoration-price').hidden = card.awaitingCardPayment;
  if (view.canDownloadHandover) {
    retention.textContent = date(view.handoverUntil) + 'まで完成ファイルの引き渡しを受けられます。有料復元のお申込みは' + date(view.restoreUntil) + 'まで受け付けます。';
  } else if (view.canRequestRestore) retention.textContent = '有料復元のお申込みは' + date(view.restoreUntil) + 'まで受け付けます。';
  else retention.textContent = '復元の受付は終了しました。';

  const fee = cardRenewalTerms.feeJpy.toLocaleString('ja-JP');
  const annual = `${cardRenewalTerms.months}か月ごとに${fee}円（税込）で自動更新します。`;
  const confirmationNotice = `決済の処理状況により、確認に${cardConfirmationDays}日程度かかる場合があります。`;
  if (card.canEnroll) text('card-terms', `登録時のお支払いは0円です。初回の請求予定は${date(card.chargeAt)}です。${annual}次回請求の予定時刻までは、この画面から停止できます。${confirmationNotice}`);
  else if (card.canStop) text('card-terms', `次回の請求予定は${date(card.chargeAt)}です。${annual}`);
  else text('card-terms', '');
  document.getElementById('card-registration').hidden = !card.canEnroll;
  cardEnroll.disabled = !card.canEnroll || !cardConsent.checked;
  cardStop.hidden = !card.canStop;
  if (card.status === 'stopped') text('card-status', '次回の自動請求を停止しました。今の契約期間は満了まで有効です。');
  else if (card.status === 'failed') text('card-status', 'カード決済に失敗しました。支払い方法の更新をご案内します。');
  else if (card.needsConfirmationReview) text('card-status', '確認に時間がかかっているため、運営側で決済状況を確認しています。');
  else if (card.holdForConfirmation) text('card-status', `カード決済の結果を確認しています。${confirmationNotice}`);
  else if (card.status === 'scheduled' && view.paymentConfirmed) text('card-status', 'カード決済を確認して、公開維持を延長しました。');
  else if (card.canStop) text('card-status', 'カードの自動更新を登録しました。');
  else if (card.status === 'scheduled') text('card-status', 'カード決済を確認できていません。');
  else if (card.canEnroll) text('card-status', 'カードの自動更新は希望制です。銀行振込も選べます。');
  else if (now < view.opensAt) text('card-status', '満了30日前から登録できます。');
  else text('card-status', '今回のカード登録の受付は終了しました。');
}

for (const button of buttons) button.addEventListener('click', () => {
  const { now, confirmedUntil } = scenarios[scenario.value];
  if (!cardRenewalWindow({ ...term, confirmedUntil: confirmedUntil ?? term.confirmedUntil }, now).canChooseBank) return;
  term = selectRenewal(term, button.dataset.choice, now);
  render();
});
cardConsent.addEventListener('change', render);
cardEnroll.addEventListener('click', () => {
  if (!cardConsent.checked) return;
  term = enrollCardRenewal(term, {
    acceptedVersion: cardRenewalTerms.version,
    subscriptionId: 'sub_sample_' + ++registrationCount,
  }, scenarios[scenario.value].now);
  cardConsent.checked = false;
  render();
});
cardStop.addEventListener('click', () => {
  term = stopCardRenewal(term, scenarios[scenario.value].now);
  render();
});
scenario.addEventListener('change', () => {
  const { now, cardResult } = scenarios[scenario.value];
  if (term.card && cardResult === 'failed') term = recordCardFailure(term, { subscriptionId: term.card.subscriptionId, periodStart: expiresAt }, now);
  if (term.card && cardResult === 'paid') term = applyCardReceipt(term, {
    subscriptionId: term.card.subscriptionId,
    invoiceId: 'in_sample_annual',
    payment: 'settled_card',
    amount: cardRenewalTerms.feeJpy,
    currency: 'jpy',
    periodStart: expiresAt,
    periodEnd: expectedRenewalEnd,
  }, now);
  render();
});
text('restoration-price', `満了後${HOSTING_RESTORATION.request_days}日以内の標準復元（希望時） ${restorationPrice()}。公開維持は再公開日から${HOSTING_RESTORATION.hosting_months}か月です。`);
render();
</script>
</body>
</html>
