<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>パスワード再設定 | SHO Band Support</title>
<link rel="stylesheet" href="./style.css"></head>
<body><header class="masthead"><a class="brand" href="./"><span class="brand-mark">S</span><span class="brand-text"><strong>SHO</strong><small>BAND SUPPORT / PRIVATE</small></span></a></header>
<main class="shell">
<section class="login-panel card" style="max-width:580px;margin:32px auto">
<p class="eyebrow">ACCOUNT RECOVERY</p><h1>パスワード再設定</h1>
<p class="muted">管理者専用。再設定メールのリンクから開き、新しいパスワードを登録してください。</p>
<form id="reset-form" class="stack" hidden>
<label>新しいパスワード（12文字以上）<input id="password" type="password" autocomplete="new-password" minlength="12" required></label>
<label>新しいパスワード（確認用）<input id="password-confirm" type="password" autocomplete="new-password" minlength="12" required></label>
<button id="reset-submit" class="primary" type="submit">パスワードを変更する</button></form>
<p id="reset-message" role="status" class="form-message">認証リンクを確認中です…</p>
<a class="ghost" href="./" style="display:inline-block;margin-top:18px;text-decoration:none">ログイン画面に戻る</a>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="./config.js" defer></script>
<script src="./reset.js" defer></script>
</body></html>
