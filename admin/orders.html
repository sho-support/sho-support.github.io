<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070707">
<title>注文管理 | SHO WEB SUPPORT</title>
<link rel="stylesheet" href="../website-theme.css">
<style>
:root{--bg:#070707;--panel:#0e0e10;--text:#fff;--soft:#c8c8cc;--muted:#85858c;--red:#c61f38;--gold:#d9ae5c;--line:rgba(255,255,255,.12);--green:#55d68a;--warn:#f0a64b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(198,31,56,.13),transparent 28%),var(--bg);color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(calc(100% - 22px),900px);margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(5,5,6,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.head{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;letter-spacing:.04em}.back{font-size:.7rem;color:#bbb}
.hero{padding:28px 0 14px}.hero small{color:var(--gold);font-size:.64rem;font-weight:950;letter-spacing:.15em}.hero h1{margin:5px 0 7px;font-size:1.65rem}.hero p{margin:0;color:var(--soft);font-size:.76rem}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.stat{padding:10px;border:1px solid var(--line);border-radius:11px;background:#101012}.stat small{display:block;color:var(--muted);font-size:.6rem}.stat b{display:block;margin-top:2px;font-size:1.05rem}
.list{display:grid;gap:9px;padding:8px 0 38px}.card{border:1px solid rgba(217,174,92,.22);border-radius:15px;background:linear-gradient(145deg,#121214,#09090a);overflow:hidden}.top{display:grid;grid-template-columns:1fr auto;gap:9px;padding:13px}.id{color:var(--gold);font-weight:950;font-size:.85rem}.name{font-weight:900;margin-top:2px}.meta{color:var(--muted);font-size:.65rem;margin-top:3px}.badge{align-self:start;padding:5px 7px;border:1px solid var(--line);border-radius:999px;font-size:.59rem;font-weight:950;white-space:nowrap}.pending_line{color:#bfc9ff}.pending_payment{color:#ffd49b;border-color:rgba(240,166,75,.45)}.site_created{color:#9aefbe;border-color:rgba(85,214,138,.42)}.cancelled{color:#aaa}.body{padding:0 13px 13px;border-top:1px solid var(--line)}.kv{display:grid;grid-template-columns:100px 1fr;gap:6px 8px;padding:10px 0;font-size:.69rem}.kv span:nth-child(odd){color:var(--muted)}.kv b{text-align:right;overflow-wrap:anywhere}.btn{width:100%;min-height:44px;border:1px solid var(--line);border-radius:9px;background:#161618;color:#fff;font-weight:950;font-size:.72rem}.btn.activate{background:#153523;border-color:rgba(85,214,138,.45);color:#baf2d1}.btn:disabled{opacity:.45}.banksetup{padding:15px;margin:12px 0;border:1px solid rgba(217,174,92,.35);border-radius:13px;background:#131313}.banksetup summary{cursor:pointer;font-weight:900;color:#e8c891}.banksetup textarea,.quotebox input,.quotebox textarea{width:100%;margin:5px 0 8px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#070709;color:#fff;font:inherit}.banksetup textarea{min-height:100px}.quotebox{padding:12px;border:1px solid var(--line);border-radius:10px;background:#0c0e10;margin:8px 0}.quotebox label{display:block;font-size:.72rem;font-weight:800;color:#eee}.quotebox input[type=checkbox]{width:auto;margin:4px 8px 0 0;padding:0;accent-color:var(--gold)}.quotebox .domain-proof{display:flex;align-items:flex-start;font-weight:600;font-size:.68rem;line-height:1.6;margin:8px 0 11px}.quotebox p{font-size:.68rem;color:#c2c2cc;margin:2px 0 9px}.btn.quotebtn{background:#402b14;border-color:#d9ae5c;color:#ffe5ad}.note{margin-top:8px;color:#888;font-size:.62rem;text-align:center}.empty{padding:30px;text-align:center;color:#888}.error{margin:10px 0;padding:10px;border-left:3px solid var(--red);background:#100b0c;color:#efb7bf;font-size:.7rem}
@media(max-width:520px){.summary{grid-template-columns:repeat(3,1fr)}.stat{padding:8px}.kv{grid-template-columns:1fr;gap:1px}.kv b{text-align:left;margin-bottom:5px}.top{padding:12px}}
</style>
</head>
<body>
<header><div class="wrap head"><div class="brand">SHO WEB SUPPORT / ORDERS</div><a class="back" href="index.html">← 制作管理</a></div></header>
<main class="wrap">
<section class="hero"><small>ORDER MANAGEMENT</small><h1>注文管理</h1><p>LINE紐付けと入金確認後の案件作成を管理します。</p></section>
<div class="summary"><div class="stat"><small>LINE待ち</small><b id="nLine">0</b></div><div class="stat"><small>入金待ち</small><b id="nPay">0</b></div><div class="stat"><small>案件作成済み</small><b id="nDone">0</b></div></div>
<details class="banksetup"><summary>本番用の振込先を設定する（管理者のみ）</summary>
 <p style="color:#c8c8cc;font-size:.73rem">銀行名・支店名・口座種別・口座番号・名義を入力してください。保存内容は公開ページには表示されず、注文ごとの<strong>正式見積りを確定して送信したときだけ</strong>お客様のLINEへ送ります。</p>
 <textarea id="bankMessage" placeholder="銀行名：…&#10;支店名：…&#10;口座：普通 …&#10;名義：…" autocomplete="off" spellcheck="false"></textarea>
 <button class="btn quotebtn" type="button" id="saveBank">振込先を保存する</button><p class="note" id="bankStatus" role="status">設定状態を確認中…</p>
 </details>
<div id="message"></div><div class="list" id="list"><div class="empty">読み込み中…</div></div>
</main>
<script type="module">
import { requireWebsiteSession, websiteSupabase } from '../website-client.js';
(async()=>{
 await requireWebsiteSession(location.href);
 const list=document.getElementById('list'),msg=document.getElementById('message');
 const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
 const labels={pending_line:'LINE送信待ち',pending_payment:'入金待ち',site_created:'案件作成済み',cancelled:'キャンセル'};
 const plans={one:'1ページ完結サイト',semi:'セミオーダーサイト',full:'フルオーダーサイト'};
 const progress={request_waiting:'制作内容の入力待ち',building:'AI制作中',sho_review:'AI制作完了・運営確認待ち',customer_review:'お客様確認待ち',live:'公開中',private:'一時非公開',improving_private:'改良中'};
 async function api(action,payload={}){
   const {data,error}=await websiteSupabase.functions.invoke('website-customer-access',{body:{action,...payload}});
   if(error)throw error;if(data?.error)throw new Error(data.error);return data;
 }
 const fmt=d=>d?new Date(d).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
 async function load(){
   msg.innerHTML='';
   try{
     const r=await api('admin_list_orders'),orders=Array.isArray(r.orders)?r.orders:[];
     document.getElementById('nLine').textContent=orders.filter(x=>x.status==='pending_line').length;
     document.getElementById('nPay').textContent=orders.filter(x=>x.status==='pending_payment').length;
     document.getElementById('nDone').textContent=orders.filter(x=>x.status==='site_created').length;
     if(!orders.length){list.innerHTML='<div class="empty">注文はまだありません。</div>';return}
     list.innerHTML=orders.map(o=>{
       const can=o.status==='pending_payment';
       const line=o.line_display_name|| (o.line_user_id?'LINE連携済み':'未連携');
       return '<article class="card"><div class="top"><div><div class="id">'+esc(o.order_code)+'</div><div class="name">'+esc(plans[o.plan]||o.plan)+'</div><div class="meta">'+esc(fmt(o.created_at))+'</div></div><span class="badge '+esc(o.status)+'">'+esc(o.status==='site_created'?(progress[o.site_status]||labels[o.status]):(labels[o.status]||o.status))+'</span></div><div class="body"><div class="kv"><span>お客様</span><b>'+esc(line)+'</b><span>テンプレート</span><b>'+esc(o.template_style||'—')+'</b><span>制作料金</span><b>¥'+Number(o.amount_from||0).toLocaleString()+'〜</b><span>SITE ID</span><b>'+esc(o.site_id||'未発行')+'</b></div>'+(o.extra_request?'<div class="note" style="color:#ebca85"><strong>追加ページ・機能の見積り相談あり</strong><br>'+esc(o.extra_request)+'<br>合計金額の案内・入金確認後に案件を作成してください。</div>':'')+
       (can?'<div class="quotebox"><label>正式な確定制作料金（円）<input data-final-amount type="number" min="'+Number(o.amount_from||15000)+'" max="3000000" step="1" value="'+Number(o.final_amount||o.amount_from||0)+'"></label><label>お客様に渡す正式URL（https://を除く）<input data-public-domain type="text" spellcheck="false" value="'+esc(o.final_public_domain||'')+'" placeholder="bandname.取得済みドメイン.jp" autocomplete="off"></label><label class="domain-proof"><input type="checkbox" data-domain-confirm>このドメインを管理でき、継続更新と印刷物への掲載について確認済み</label><label>追加内容・見積り補足（任意）<textarea data-quote-note rows="2" placeholder="例：追加ページ1枚を含む。その他追加費用なし。"></textarea></label><p>'+(o.final_quote_sent_at?'正式見積り送信済み：¥'+Number(o.final_amount||0).toLocaleString()+'（'+esc(fmt(o.final_quote_sent_at))+'） / URL：'+esc(o.final_public_domain||'未登録'):'まだ正式見積りを送信していません。確定金額と正式URLを先に確認してください。')+'</p><button class="btn quotebtn" data-quote="'+esc(o.order_code)+'" type="button">確定金額・振込先をLINEへ送信</button></div><button class="btn activate" data-activate="'+esc(o.order_code)+'" type="button"'+(o.final_quote_sent_at&&o.final_public_domain?'':' disabled')+'>入金確認済み → 案件作成・URL送信</button><div class="note">LINE見積り送信後、実際の着金を確認してから案件作成してください。</div>':
       o.status==='pending_line'?'<button class="btn" disabled>お客様のLINE送信待ち</button>':
       o.status==='site_created'?(o.site_status==='request_waiting'?'<button class="btn resend" data-resend="'+esc(o.order_code)+'" type="button">ヒアリングURLをLINEへ再送</button>':'<div class="note" style="font-size:.76rem;color:#d9ae5c">現在：'+esc(progress[o.site_status]||'案件進行中')+'</div>')+'<a class="btn activate" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:8px" href="index.html?site='+encodeURIComponent(o.site_id||'')+'">SITE ID '+esc(o.site_id||'')+' の制作管理を開く</a>':'')+
       '</div></article>';
     }).join('');
     document.querySelectorAll('[data-quote]').forEach(btn=>btn.onclick=async()=>{
       const code=btn.dataset.quote,box=btn.closest('.quotebox');
       const finalAmount=Number(box?.querySelector('[data-final-amount]')?.value);
       const note=box?.querySelector('[data-quote-note]')?.value.trim()||'';
       const publicDomain=box?.querySelector('[data-public-domain]')?.value.trim().toLowerCase()||'';
       const domainConfirmed=box?.querySelector('[data-domain-confirm]')?.checked===true;
       const order=orders.find(o=>o.order_code===code);
       if(!Number.isSafeInteger(finalAmount)||finalAmount<Number(order?.amount_from||0))return alert('基本料金以上の正式な確定金額を入力してください。');
       if(!publicDomain||!domainConfirmed)return alert('正式公開URLを入力し、ドメイン取得・管理権限と更新負担を確認してください。');
       if(!confirm(code+' の確定金額 '+finalAmount.toLocaleString()+'円、正式URL https://'+publicDomain+'/ と振込先をお客様のLINEへ送信します。内容とURLを確認しましたか？'))return;
       btn.disabled=true;btn.textContent='LINEへ送信中…';
       try{await api('admin_send_final_quote',{order_code:code,final_amount:finalAmount,public_domain:publicDomain,domain_control_confirmed:domainConfirmed,quote_note:note});alert('正式見積りと振込先をLINEに送信しました。');await load()}
       catch(e){alert(e.message||'見積りの送信に失敗しました。');btn.disabled=false;btn.textContent='確定金額・振込先をLINEへ送信'}
     });
     document.querySelectorAll('[data-activate]').forEach(btn=>btn.onclick=async()=>{
       const code=btn.dataset.activate;
       const thisOrder=orders.find(o=>o.order_code===code);
       if(thisOrder?.extra_request&&!confirm('追加ページの見積り確定・合計金額の案内・入金確認は完了していますか？'))return;
       if(!confirm(code+' の入金を確認済みとして、SITE IDを発行しヒアリングURLを送信しますか？'))return;
       btn.disabled=true;btn.textContent='処理中…';
       try{const r=await api('admin_activate_order',{order_code:code});alert(r.warning||('SITE ID '+r.site_id+' を発行し、LINEへヒアリングURLを送りました。'));await load()}
       catch(e){alert(e.message||'処理に失敗しました。');btn.disabled=false;btn.textContent='入金確認済み → 案件作成・URL送信'}
     });
     document.querySelectorAll('[data-resend]').forEach(btn=>btn.onclick=async()=>{
       const code=btn.dataset.resend;
       if(!confirm(code+' のお客様に新しいヒアリングURLをLINEで再送しますか？旧URLは利用できなくなります。'))return;
       btn.disabled=true;btn.textContent='再送中…';
       try{await api('admin_resend_intake',{order_code:code});alert('LINEへの再送を受け付けました。');await load()}
       catch(e){alert(e.message||'再送に失敗しました。');btn.disabled=false;btn.textContent='ヒアリングURLをLINEへ再送'}
     });
   }catch(e){list.innerHTML='<div class="empty">読み込めませんでした。</div>';msg.innerHTML='<div class="error">'+esc(e.message||e)+'</div>'}
 }
 async function loadBank(){
   const status=document.getElementById('bankStatus');
   try{const r=await api('admin_bank_settings');document.getElementById('bankMessage').value=r.message||'';
     status.textContent=r.message?'本番用の振込先は設定済みです。':'本番用の振込先は未設定です。注文への正式見積り送信前に登録してください。';
   }catch(e){status.textContent=e.message||'振込先の設定を読み込めませんでした。'}
 }
 document.getElementById('saveBank').addEventListener('click',async()=>{
   const val=document.getElementById('bankMessage').value.trim();
   if(val&&!confirm('入力した本番用振込先を保存しますか？正式見積りを送る際、お客様へこの情報が送信されます。'))return;
   if(!val&&!confirm('本番用振込先を空欄にして、正式見積り送信を停止しますか？'))return;
   const button=document.getElementById('saveBank');button.disabled=true;
   try{await api('admin_save_bank_settings',{bank_message:val});await loadBank()}
   catch(e){alert(e.message||'振込先を保存できませんでした。')}
   finally{button.disabled=false}
 });
 await Promise.all([load(),loadBank()]);
})();
</script>
</body></html>
