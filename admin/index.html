<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070707">
<title>SHO WEB SUPPORT | Admin</title>
<link rel="stylesheet" href="../website-theme.css">
<style>
:root{--bg:#070707;--panel:#0d0d0f;--text:#fff;--soft:#c9c9cd;--muted:#85858c;--red:#c61f38;--gold:#d9ae5c;--line:rgba(255,255,255,.12);--ok:#55d68a;--warn:#f0a64b}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:radial-gradient(circle at 12% 0,rgba(198,31,56,.14),transparent 27%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.65}
a{color:inherit;text-decoration:none}button,textarea{font:inherit}.wrap{width:min(calc(100% - 24px),980px);margin:auto}
header{position:sticky;top:0;z-index:30;background:rgba(5,5,6,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.head{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;letter-spacing:.05em}.brand small{display:block;color:var(--muted);font-size:.62rem;letter-spacing:.14em}.demo{padding:6px 9px;border:1px solid rgba(240,166,75,.42);border-radius:999px;color:#ffd49b;font-size:.66rem;font-weight:900}
.hero{padding:24px 0 10px}.hero h1{margin:0;font-size:clamp(1.35rem,4vw,1.9rem);line-height:1.25}.hero p{margin:8px 0 0;color:var(--soft);font-size:.78rem;line-height:1.75}.warning{margin-top:13px;padding:11px 13px;border-left:3px solid var(--warn);background:#0d0d0f;color:#d4cec5;font-size:.75rem}
.toolbar{margin:18px 0 12px}.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}.tab{flex:0 0 auto;border:1px solid var(--line);background:#101012;color:#c8c8cc;padding:8px 11px;border-radius:9px;font-size:.7rem;font-weight:900}.tab.active{border-color:rgba(198,31,56,.72);background:rgba(198,31,56,.12);color:#fff}.subtools{display:flex;justify-content:flex-end;margin-top:7px}.reset{border:1px solid var(--line);background:#111;color:#999;padding:7px 10px;border-radius:9px;font-size:.68rem}
.project-list{display:grid;gap:10px;padding-bottom:46px}.project-card{border:1px solid rgba(217,174,92,.24);border-radius:17px;background:linear-gradient(145deg,#121215,#0a0a0b);overflow:hidden}.project-card>summary{cursor:pointer;list-style:none;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.project-card>summary::-webkit-details-marker{display:none}.project-card[open]>summary{border-bottom:1px solid var(--line);background:rgba(198,31,56,.045)}.sum-main{min-width:0}.siteid{color:var(--gold);font-size:.68rem;font-weight:950;letter-spacing:.06em}.site-name{margin:2px 0 3px;font-size:1rem;font-weight:950;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.67rem}.sum-side{display:flex;align-items:center;gap:7px}.chev{color:#c84a5d;font-weight:900}.project-card[open] .chev{transform:rotate(45deg)}
.badge{display:inline-flex;padding:5px 7px;border:1px solid var(--line);border-radius:999px;font-size:.61rem;font-weight:950;white-space:nowrap}.s-request{color:#ffd49b;border-color:rgba(240,166,75,.45)}.s-building{color:#bdc8ff;border-color:rgba(125,143,255,.45)}.s-sho{color:#ffb0bb;border-color:rgba(198,31,56,.55)}.s-customer{color:#ecd18f;border-color:rgba(217,174,92,.5)}.s-live{color:#9aefbe;border-color:rgba(85,214,138,.48)}.s-private{color:#c7c7cb}.s-improving{color:#dcb8ff;border-color:rgba(176,112,232,.45)}
.project-body{padding:13px}.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:11px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#171719;color:#fff;font-size:.71rem;font-weight:950;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red)}.btn.gold{background:#211b10;border-color:rgba(217,174,92,.45);color:#f1d492}.btn.green{background:#123020;border-color:rgba(85,214,138,.45);color:#b3f0cd}.btn.full{width:100%}
.workflow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0 12px}.workflow span{padding:7px 4px;border:1px solid var(--line);border-radius:7px;text-align:center;color:#6f6f74;font-size:.57rem}.workflow span.on{color:#fff;border-color:rgba(198,31,56,.62);background:rgba(198,31,56,.1)}
.fold{margin-top:9px;border:1px solid var(--line);border-radius:12px;background:#0c0c0e;overflow:hidden}.fold>summary{cursor:pointer;list-style:none;padding:11px 13px;font-size:.78rem;font-weight:950;display:flex;justify-content:space-between;gap:10px}.fold>summary::-webkit-details-marker{display:none}.fold>summary:after{content:"＋";color:var(--gold)}.fold[open]>summary{border-bottom:1px solid var(--line)}.fold[open]>summary:after{content:"−"}.inside{padding:12px 13px}.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;font-size:.73rem}.kv dt{color:var(--muted);font-weight:900}.kv dd{margin:0;color:#eee;overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{padding:5px 7px;border:1px solid rgba(217,174,92,.24);border-radius:8px;background:#111;color:#e2d2ad;font-size:.66rem}
.timeline{display:grid;gap:9px}.event{position:relative;padding:0 0 9px 14px;border-left:1px solid rgba(217,174,92,.25)}.event:before{content:"";position:absolute;left:-4px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--gold)}.event time{display:block;color:var(--muted);font-size:.62rem}.event strong{display:block;margin:2px 0;font-size:.73rem}.event p{margin:0;color:#c5c5ca;font-size:.7rem;white-space:pre-wrap}.note{width:100%;min-height:86px;padding:10px;border:1px solid var(--line);border-radius:9px;background:#111;color:#fff;resize:vertical}.actionbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.review-panel{margin-top:10px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#09090b}.review-panel[hidden]{display:none}.review-help{margin:0 0 8px;color:#aaa;font-size:.69rem}.footnote{margin-top:10px;color:#777;font-size:.64rem}
.empty{padding:28px 12px;color:var(--muted);text-align:center;font-size:.8rem}
@media(max-width:640px){.wrap{width:min(calc(100% - 20px),980px)}.project-card>summary{padding:14px 13px}.sum-side{align-items:flex-end;flex-direction:column;gap:5px}.workflow{grid-template-columns:1fr 1fr}.workflow span:last-child{grid-column:1/-1}.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:7px}.actionbar{grid-template-columns:1fr}.top-actions .btn{flex:1 1 150px}}
</style>
</head>
<body>
<header><div class="wrap head"><div class="brand">SHO WEB SUPPORT<small>OWNER ADMIN</small></div><div style="display:flex;align-items:center;gap:7px"><a class="demo" href="orders.html" style="text-decoration:none">注文管理</a><div class="demo" id="modeBadge">PRODUCTION</div></div></div></header>
<main class="wrap">
<section class="hero"><h1>制作管理</h1><p>SITE IDごとに制作状況・カルテ・要望履歴・承認を管理します。</p><div class="warning" id="modeWarning" hidden><strong>デモモード。</strong> 変更はこのブラウザ内だけに保存されます。</div></section>
<div class="toolbar"><div class="tabs" id="tabs"></div><div class="subtools"><button class="reset" id="resetDemo" type="button">デモ状態を初期化</button></div></div>
<div class="project-list" id="projectList"></div>
</main>
<script type="module">
import { requireWebsiteSession, websiteApi, websiteSupabase } from '../website-client.js';

(async()=>{
const KEY='sho-web-admin-demo-v2';
const params=new URLSearchParams(location.search);
const prodMode=params.get('demo')!=='1';
const statuses=[
 {id:'request_waiting',label:'要望待ち',className:'s-request'},
 {id:'building',label:'作成中',className:'s-building'},
 {id:'sho_review',label:'運営確認中',className:'s-sho'},
 {id:'customer_review',label:'お客様最終確認中',className:'s-customer'},
 {id:'live',label:'公開中',className:'s-live'},
 {id:'private',label:'一時非公開',className:'s-private'},
 {id:'improving_private',label:'改良中・一時非公開',className:'s-improving'}
];
const mainFlow=['request_waiting','building','sho_review','customer_review','live'];
const demo=[{
 id:'1042',name:"Guns N' Loses Demo",customer:'顧客デモ',status:'sho_review',updated:'2026-10-28 23:10',
 preview:'../index.html',customerReview:'../website-customer-review.html?id=1042',
 profile:{industry:'バンド / アーティスト',mood:['80s US rock','dark','premium'],colors:['黒','深い赤','くすんだゴールド'],likes:['写真を大きく見せる','太い英字見出し','LIVE情報を目立たせる'],dislikes:['角丸が多すぎるUI','小さすぎる文字','明るいSaaS風']},
 current:'初回ヒアリング内容を反映したサイト案をSHOが確認中。',
 history:[
  {at:'2026-10-28 23:08',title:'AI制作完了',text:'初回ヒアリングと確定仕様からプレビューを生成。'},
  {at:'2026-10-28 22:55',title:'ヒアリング受付',text:'黒＋赤、80年代USロック、写真を大きく、LIVE情報を優先。'},
  {at:'2026-10-28 22:50',title:'案件作成',text:'SITE ID 1042 を発行。'}
 ],notes:[],customerApproved:false,jobs:[]
}];

document.getElementById('modeBadge').textContent=prodMode?'PRODUCTION':'DEMO / LOCAL DATA';
document.getElementById('modeWarning').hidden=prodMode;
document.getElementById('resetDemo').hidden=prodMode;
let state=[],filter='all';
const clone=v=>JSON.parse(JSON.stringify(v));
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const sdef=id=>statuses.find(s=>s.id===id)||statuses[0];
const now=()=>new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
const fmt=arr=>(arr||[]).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')||'<span class="meta">未登録</span>';
const formatDate=v=>v?new Date(v).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'):'';
const activityLabel=a=>({
 site_created:'案件作成',intake_submitted:'ヒアリング受付',customer_revision_requested:'お客様から修正依頼',
 customer_approved:'お客様確認OK',published:'公開',admin_transition:'SHO操作',line_message:'LINEメッセージ',ai_build_completed:'AI制作完了',ai_build_error:'AI制作エラー'
}[a]||a);
const jobLabel=j=>({
 initial_create:'初回制作',customer_revision:'お客様修正',sho_revision:'SHO修正',improvement:'改良'
}[j]||j||'');
const jobStatus=s=>({queued:'待機中',running:'AI作成中',sho_review:'SHO確認待ち',done:'完了',error:'エラー'}[s]||s||'');

function loadDemo(){
 try{
  const raw=localStorage.getItem(KEY);
  if(raw)return JSON.parse(raw);
  const x=clone(demo);localStorage.setItem(KEY,JSON.stringify(x));return x;
 }catch{return clone(demo)}
}
function saveDemo(){localStorage.setItem(KEY,JSON.stringify(state))}

function normalizeProduction(detail){
 const site=detail.site||{},payload=detail.intake?.payload||{},f=payload.fields||{},checks=payload.checks||{},savedProfile=detail.profile||{};
 const features=Array.isArray(checks.features)?checks.features:[];
 const prefs=savedProfile.preferences||{};
 const history=(detail.activity||[]).map(a=>({at:formatDate(a.created_at),title:activityLabel(a.action),text:a.detail||''}));
 return {
  id:site.site_id,
  name:site.site_name||f.site_name||'ホームページ',
  customer:f.contact_name||f.contact_email||'顧客',
  status:site.status,
  updated:formatDate(site.updated_at),
  preview:site.preview_url||'',
  customerReview:'../website-customer-review.html?id='+encodeURIComponent(site.site_id)+'&prod=1',
  profile:{
   industry:savedProfile.industry||f.purpose||'未入力',
   mood:Array.isArray(prefs.mood)&&prefs.mood.length?prefs.mood:(f.image_text?[f.image_text]:[]),
   colors:Array.isArray(prefs.colors)&&prefs.colors.length?prefs.colors:(f.colors?[f.colors]:[]),
   likes:Array.isArray(prefs.likes)&&prefs.likes.length?prefs.likes:features.concat((checks.live_all_page||[]).length?['LIVE関連をすべて別ページ']:[]),
   dislikes:Array.isArray(prefs.dislikes)?prefs.dislikes:[],
  },
  current:site.current_note||'',
  history,notes:[],customerApproved:Boolean(site.customer_approved),jobs:detail.jobs||[],updates:detail.updates||[],reviewIssues:detail.reviewIssues||[],freeAdjustmentUntil:site.adjustment_free_until||'',freeUpdatesUntil:site.update_free_until||'',
  repoFullName:site.repo_full_name||'',publishBranch:site.publish_branch||'main',
  livePath:site.live_path||'/',offlinePath:site.offline_path||'/docs',
  customDomain:site.custom_domain||'',publicUrl:site.public_url||''
 };
}

async function loadProduction(){
 await requireWebsiteSession(location.href);
 const list=await websiteApi('list_sites');
 if(!list?.admin)throw new Error('SHO管理者として登録されたアカウントでログインしてください。');
 const sites=Array.isArray(list.sites)?list.sites:[];
 for(const site of sites){
  if(site.status!=='live'&&/^https:\/\/sho-support\.github\.io\/site-/i.test(site.preview_url||'')){
   try{await websiteApi('admin_secure_preview',{site_id:site.site_id});}catch(error){console.error('Secure legacy preview failed',error);}
  }
 }
 return await Promise.all(sites.map(async s=>normalizeProduction(await websiteApi('load_site',{site_id:s.site_id}))));
}

function tabs(){
 const items=[{id:'all',label:'すべて'}].concat(statuses);
 document.getElementById('tabs').innerHTML=items.map(t=>{
  const n=t.id==='all'?state.length:state.filter(p=>p.status===t.id).length;
  return '<button class="tab '+(filter===t.id?'active':'')+'" data-filter="'+t.id+'" type="button">'+esc(t.label)+' '+n+'</button>';
 }).join('');
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});
}
function workflow(p){return '<div class="workflow">'+mainFlow.map(id=>'<span class="'+(p.status===id?'on':'')+'">'+esc(sdef(id).label)+'</span>').join('')+'</div>'}
function historyHtml(p){
 const all=(p.notes||[]).concat(p.history||[]).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
 return all.length?all.map(h=>'<div class="event"><time>'+esc(h.at)+'</time><strong>'+esc(h.title)+'</strong><p>'+esc(h.text)+'</p></div>').join(''):'<span class="meta">履歴はまだありません。</span>';
}
function latestJob(p){
 const j=(p.jobs||[])[0];
 if(!j)return '<span class="meta">なし</span>';
 const err=j.error_message?' / '+j.error_message:'';
 return '<span>'+esc(jobLabel(j.kind))+' / '+esc(jobStatus(j.status))+esc(err)+'</span>';
}
function updateRequestHtml(p){
 if(!prodMode)return '';
 const updates=p.updates||[];
 const dates='<dl class="kv"><dt>公開後30日調整</dt><dd>'+(p.freeAdjustmentUntil?esc(new Date(p.freeAdjustmentUntil).toLocaleDateString('ja-JP'))+'まで':'未開始')+'</dd><dt>無料更新3か月</dt><dd>'+(p.freeUpdatesUntil?esc(new Date(p.freeUpdatesUntil).toLocaleDateString('ja-JP'))+'まで':'対象外・未開始')+'</dd></dl>';
 const rows=updates.length?updates.map(x=>'<div class="event" style="margin-top:10px"><time>依頼 #'+esc(x.id)+' / '+esc(new Date(x.created_at).toLocaleString('ja-JP'))+'</time><strong>'+esc(x.status==='pending_sho'?'SHO確認待ち':x.status)+' / '+esc(x.billing_category==='free_monthly'?'無料更新枠':x.billing_category==='free_adjustment_review'?'30日調整の確認':'料金見積り')+'</strong><p>'+esc(x.request_note)+'</p>'+(x.status==='pending_sho'?'<button class="btn primary" type="button" data-start-update="'+esc(x.id)+'" data-billing="'+esc(x.billing_category)+'">内容・入金確認済み → AI制作開始</button>':'')+'</div>').join(''):'<span class="meta">更新依頼はありません。</span>';
 return '<details class="fold" open><summary>無料期間・更新依頼 ('+updates.length+')</summary><div class="inside">'+dates+'<div class="timeline">'+rows+'</div></div></details>';
}
function reviewIssuesHtml(p){
 const issues=p.reviewIssues||[],unresolved=issues.filter(x=>x.status!=='confirmed').length;
 if(!issues.length)return '<div class="history-note" style="margin-top:10px">修正項目はまだありません。プレビューで不具合があれば修正内容を入力してください。</div>';
 return '<div class="review-panel"><strong>修正項目（'+(issues.length-unresolved)+' / '+issues.length+' 確認済み）</strong><div class="timeline" style="margin-top:11px">'+issues.map(x=>'<div class="event"><time>修正 #'+esc(x.id)+' / '+esc(formatDate(x.created_at))+'</time><p>'+esc(x.note)+'</p><p style="margin-top:5px">'+(x.status==='confirmed'?'<span style="color:var(--ok)">✓ 確認済み</span>':x.status==='ready_for_check'?'<span style="color:var(--warn)">修正案ができました。プレビューを確認してください。</span>':'修正中')+'</p>'+(x.status==='ready_for_check'?'<button type="button" class="btn green" data-confirm-issue="'+esc(x.id)+'" style="margin-top:8px">修正を確認した ✓</button>':'')+'</div>').join('')+'</div></div>';
}
function actionHtml(p){
 if(p.status==='request_waiting')return prodMode?'<div class="warning" style="margin-top:0">お客様のヒアリング・要望入力待ちです。送信されると自動で作成中へ進みます。</div>':'<div class="warning" style="margin-top:0">ヒアリングや追加要望の入力待ちです。</div><button class="btn primary full" id="startBuild" type="button" style="margin-top:8px">デモ：要望受信 → 作成開始</button>';
 if(p.status==='building')return prodMode?'<div class="warning" style="margin-top:0">AIが制作・修正を処理中です。通常は自動で進み、完了するとSHO確認待ちへ移動してLINE通知します。</div><button class="btn primary full" id="runWorker" type="button" style="margin-top:8px">AI制作を実行 / 再実行</button>':'<div class="warning" style="margin-top:0">AI制作キューまたは修正作業中です。</div><button class="btn primary full" id="buildDone" type="button" style="margin-top:8px">デモ：作成完了 → SHO確認へ</button>';
 if(p.status==='sho_review'){
 const unresolved=(p.reviewIssues||[]).filter(x=>x.status!=='confirmed').length;
 return '<div class="warning" style="margin-top:0;border-left-color:var(--ok)">制作案を確認してください。問題があれば修正内容を送信できます。運営が確認OKにするまでお客様へURLは送られません。</div>'+
 (p.preview?'<a class="btn primary full" href="'+esc(p.preview)+'" target="_blank" rel="noopener" style="margin-top:8px">① プレビューを確認</a>':'<div class="warning">プレビューの準備中です。</div>')+reviewIssuesHtml(p)+
 '<div class="actionbar"><button class="btn" id="openReviewFix" type="button">② 修正を依頼する</button><button class="btn green" id="approveSho" type="button" '+(unresolved?'disabled title="未確認の修正項目が残っています"':'')+'>③ 確認OK → お客様へ送る</button></div>'+
 '<div class="review-panel" id="shoRevisionPanel" hidden><p class="review-help">修正する場所と内容を具体的に入力してください。</p><textarea class="note" id="reviewNote" placeholder="例：TOPの画像が表示されていない。写真を修正し、他は変更しない。"></textarea><div class="actionbar"><button class="btn" id="closeReviewFix" type="button">戻る</button><button class="btn primary" id="requestFix" type="button">修正内容を送信・再制作</button></div></div>';
}
if(p.status==='customer_review')return '<div class="warning" style="margin-top:0">お客様の最終確認待ちです。必要に応じて確認URLをLINEで再送できます。内容承認後はお客様が公開を選びます。</div><button class="btn gold full" id="resendCustomerReview" type="button" style="margin-top:8px">お客様へサイト確認URLをLINEで再送</button>';
 if(p.status==='live')return '<div class="warning" style="margin-top:0;border-left-color:var(--ok)">サイトは公開中です。</div><div class="actionbar"><button class="btn" id="makePrivate" type="button">一時非公開</button><button class="btn gold" id="makeImproving" type="button">改良中・一時非公開</button></div>';
 if(p.status==='private')return '<div class="warning" style="margin-top:0">サイトを一時的に非公開にしている状態です。</div><button class="btn green full" data-action="resumeLive" type="button" style="margin-top:8px">公開を再開</button>';
 if(p.status==='improving_private')return '<div class="warning" style="margin-top:0">改良のため一時非公開です。改良内容を入力して制作へ戻せます。</div><textarea class="note" id="improveNote" placeholder="改良したい内容"></textarea><div class="actionbar"><button class="btn primary" id="startImprove" type="button">AIへ改良依頼</button><button class="btn green" data-action="resumeLive" type="button">そのまま再公開</button></div>';
 return '';
}
function card(p){
 const s=sdef(p.status);
 const preview=p.preview?'<a class="btn primary" href="'+esc(p.preview)+'" target="_blank" rel="noopener">プレビューを開く</a>':'<span class="btn" style="opacity:.45;pointer-events:none">プレビュー準備中</span>';
 return '<details class="project-card" data-id="'+esc(p.id)+'"><summary><div class="sum-main"><div class="siteid">SITE ID '+esc(p.id)+'</div><div class="site-name">'+esc(p.name)+'</div><div class="meta">'+esc(p.customer)+' / 更新 '+esc(p.updated)+'</div></div><div class="sum-side"><span class="badge '+s.className+'">'+esc(s.label)+'</span><span class="chev">＋</span></div></summary>'+
 '<div class="project-body"><div class="top-actions">'+(p.status==='sho_review'?'':preview)+(p.status==='customer_review'||p.status==='live'?'<a class="btn" href="'+esc(p.customerReview)+'" target="_blank" rel="noopener">お客様確認画面</a>':'')+'</div>'+workflow(p)+
 '<details class="fold" open><summary>現在の依頼・状態</summary><div class="inside"><dl class="kv"><dt>状態</dt><dd>'+esc(s.label)+'</dd><dt>現在</dt><dd>'+esc(p.current)+'</dd><dt>AIジョブ</dt><dd>'+latestJob(p)+'</dd><dt>顧客確認URL</dt><dd>'+esc(p.customerReview)+'</dd></dl></div></details>'+
 updateRequestHtml(p)+
 '<details class="fold" open><summary>今回の操作</summary><div class="inside">'+actionHtml(p)+'</div></details>'+
 '<details class="fold"><summary>顧客カルテ</summary><div class="inside"><dl class="kv"><dt>業種</dt><dd>'+esc(p.profile.industry)+'</dd><dt>雰囲気・要望</dt><dd><div class="chips">'+fmt(p.profile.mood)+'</div></dd><dt>色</dt><dd><div class="chips">'+fmt(p.profile.colors)+'</div></dd><dt>希望機能</dt><dd><div class="chips">'+fmt(p.profile.likes)+'</div></dd><dt>避けたいもの</dt><dd><div class="chips">'+fmt(p.profile.dislikes)+'</div></dd></dl></div></details>'+
 '<details class="fold"><summary>要望・承認履歴</summary><div class="inside"><div class="timeline">'+historyHtml(p)+'</div></div></details>'+
 (prodMode?'<details class="fold"><summary>公開設定</summary><div class="inside"><label style="display:block;font-size:.7rem;color:#aaa">GitHub Repo<input id="repoFullName" type="text" value="'+esc(p.repoFullName)+'" placeholder="sho-support/customer-site-1042" style="width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#111;color:#fff"></label><div class="actionbar"><label style="font-size:.7rem;color:#aaa">公開ブランチ<input id="publishBranch" type="text" value="'+esc(p.publishBranch)+'" style="width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#111;color:#fff"></label><label style="font-size:.7rem;color:#aaa">独自ドメイン<input id="customDomain" type="text" value="'+esc(p.customDomain)+'" placeholder="example.com" style="width:100%;margin-top:5px;padding:9px;border:1px solid var(--line);border-radius:8px;background:#111;color:#fff"></label></div><div class="actionbar"><button class="btn" id="saveRepoConfig" type="button">Repo設定を保存</button><button class="btn gold" id="saveDomain" type="button">独自ドメインをGitHubへ設定</button></div><div class="meta" style="margin-top:8px">通常公開：/　｜　一時非公開・改良中：/docs　｜　DNS設定はドメイン会社側で別途行います。</div></div></details>':'')+
 '<div class="footnote">'+(prodMode?'本番データ：Supabase / private Storage':'デモデータ：このブラウザのlocalStorage')+'</div></div></details>';
}

async function prodMove(p,status,current,detail=''){
 try{
  const response=await websiteApi('admin_transition',{site_id:p.id,status,current_note:current,detail});
  state=await loadProduction();render();
  if(response?.warning)alert(response.warning);
 }catch(error){alert(error.message||'更新できませんでした。')}
}
function demoMove(p,status,current,title,text){p.status=status;p.current=current;p.updated=now();p.customerApproved=false;p.notes=p.notes||[];p.notes.unshift({at:p.updated,title,text});saveDemo();render()}

function bind(p,root){
 const q=id=>root.querySelector('#'+id);
 root.querySelectorAll('[data-start-update]').forEach(btn=>btn.addEventListener('click',async()=>{
  const paid=btn.dataset.billing==='estimate_required';
  if(!confirm(paid?'入金確認済みですか？ 制作を開始すると確認完了まで一時非公開になります。':'この更新をAIで制作しますか？ 確認完了まで一時非公開になります。'))return;
  btn.disabled=true;btn.textContent='処理中…';
  try{await websiteApi('admin_start_update',{site_id:p.id,update_request_id:Number(btn.dataset.startUpdate),payment_confirmed:paid});state=await loadProduction();render();}catch(error){alert(error.message||'更新を開始できませんでした。');btn.disabled=false;btn.textContent='内容・入金確認済み → AI制作開始'}
 }));
 q('startBuild')?.addEventListener('click',()=>demoMove(p,'building','要望を受信。AIがサイトを作成中。','作成開始','受信した要望から制作を開始。'));
 q('buildDone')?.addEventListener('click',()=>demoMove(p,'sho_review','AI制作完了。SHOが内容を確認中。','AI制作完了','SHO確認へ移行。'));
 q('runWorker')?.addEventListener('click',async()=>{try{await websiteApi('admin_run_worker',{site_id:p.id});state=await loadProduction();render()}catch(error){alert(error.message||'AI制作を開始できませんでした。')}});
 const shoRevisionPanel=q('shoRevisionPanel');
 q('openReviewFix')?.addEventListener('click',()=>{if(shoRevisionPanel){shoRevisionPanel.hidden=false;q('reviewNote')?.focus();}});
 q('closeReviewFix')?.addEventListener('click',()=>{if(shoRevisionPanel)shoRevisionPanel.hidden=true;});
 q('approveSho')?.addEventListener('click',()=>{if(!confirm('SHO確認を完了し、お客様の最終確認へ送りますか？\nLINE連携済みの場合はお客様へ通知されます。'))return;prodMode?prodMove(p,'customer_review','SHO確認済み。お客様の最終確認中。','SHO確認OK。お客様最終確認へ。'):demoMove(p,'customer_review','SHO確認済み。お客様の最終確認中。','SHO確認OK','お客様最終確認へ移行。')});
 q('resendCustomerReview')?.addEventListener('click',async()=>{if(!confirm('お客様へ新しいサイト確認URLを送信しますか？以前のURLは使えなくなります。'))return;const btn=q('resendCustomerReview');btn.disabled=true;try{const {data,error}=await websiteSupabase.functions.invoke('website-customer-access',{body:{action:'admin_send_review',site_id:p.id}});if(error||data?.error)throw new Error(data?.error||'LINEへ送信できませんでした。');alert('サイト確認URLをLINEへ再送しました。');}catch(e){alert(e.message||'再送に失敗しました。')}finally{btn.disabled=false}});
 q('requestFix')?.addEventListener('click',async()=>{const note=q('reviewNote').value.trim();if(!note)return alert('修正内容を入力してください。');if(prodMode){try{q('requestFix').disabled=true;await websiteApi('admin_request_review_fix',{site_id:p.id,detail:note});state=await loadProduction();render()}catch(e){alert(e.message||'修正を依頼できませんでした。');q('requestFix').disabled=false}}else demoMove(p,'building','修正内容をもとに作成中。','修正依頼',note)});
 root.querySelectorAll('[data-confirm-issue]').forEach(btn=>btn.addEventListener('click',async()=>{btn.disabled=true;try{await websiteApi('admin_confirm_review_fix',{site_id:p.id,review_issue_id:Number(btn.dataset.confirmIssue)});state=await loadProduction();render()}catch(e){alert(e.message||'確認を登録できませんでした。');btn.disabled=false}}));
 q('makePrivate')?.addEventListener('click',()=>prodMode?prodMove(p,'private','サイトを一時非公開中。','一時非公開。'):demoMove(p,'private','サイトを一時非公開中。','一時非公開','SHO操作で一時非公開。'));
 q('makeImproving')?.addEventListener('click',()=>prodMode?prodMove(p,'improving_private','改良のため一時非公開中。','改良準備のため一時非公開。'):demoMove(p,'improving_private','改良のため一時非公開中。','改良中・一時非公開','改良準備のため一時非公開。'));
 el.querySelector('[data-action="resumeLive"]')?.addEventListener('click',()=>prodMode?prodMove(p,'live','サイト公開中。','公開を再開。'):demoMove(p,'live','サイト公開中。','公開再開','サイトを再公開。'));
 q('startImprove')?.addEventListener('click',()=>{const t=q('improveNote').value.trim();if(!t)return alert('改良内容を入力してください。');prodMode?prodMove(p,'building','改良内容をもとに作成中。',t):demoMove(p,'building','改良内容をもとに作成中。','改良依頼',t)});
 q('saveRepoConfig')?.addEventListener('click',async()=>{try{await websiteApi('admin_repo_config',{site_id:p.id,repo_full_name:q('repoFullName').value.trim(),publish_branch:q('publishBranch').value.trim()||'main',live_path:'/',offline_path:'/docs'});state=await loadProduction();render()}catch(error){alert(error.message||'Repo設定を保存できませんでした。')}});
 q('saveDomain')?.addEventListener('click',async()=>{try{const d=q('customDomain').value.trim();await websiteApi('admin_domain',{site_id:p.id,custom_domain:d||null});state=await loadProduction();render()}catch(error){alert(error.message||'独自ドメインを設定できませんでした。')}});
}

function render(){
 tabs();
 const list=state.filter(p=>filter==='all'||p.status===filter);
 const box=document.getElementById('projectList');
 box.innerHTML=list.length?list.map(card).join(''):'<div class="empty">該当案件はありません。</div>';
 box.querySelectorAll('.project-card').forEach(root=>{const p=state.find(x=>String(x.id)===String(root.dataset.id));if(p)bind(p,root)});
 const focus=params.get('site');if(focus){const target=[...box.querySelectorAll('.project-card')].find(x=>x.dataset.id===focus);if(target){target.open=true;target.scrollIntoView({block:'start'});}}
}

if(prodMode){
 document.getElementById('modeBadge').textContent='PRODUCTION / SUPABASE';
 document.getElementById('modeWarning').hidden=true;
 document.getElementById('resetDemo').style.display='none';
 try{state=await loadProduction()}catch(error){
  console.error(error);
  document.getElementById('projectList').innerHTML='<div class="empty">'+esc(error.message||'管理データを読み込めませんでした。')+'</div>';
  return;
 }
}else{
 state=loadDemo();
 document.getElementById('resetDemo').onclick=()=>{if(confirm('このブラウザのデモ状態を初期化しますか？')){localStorage.removeItem(KEY);state=loadDemo();filter='all';render()}};
}
render();
})();
</script>
</body>
</html>
