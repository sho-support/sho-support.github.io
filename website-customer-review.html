<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070707">
<title>Website Review | SHO WEB SUPPORT</title>
<link rel="stylesheet" href="website-theme.css">
<style>
:root{--bg:#070707;--text:#fff;--soft:#c8c8cb;--muted:#818187;--red:#c61f38;--gold:#d9ae5c;--line:rgba(255,255,255,.12);--ok:#55d68a}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:radial-gradient(circle at 10% 0,rgba(198,31,56,.12),transparent 26%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.65}.wrap{width:min(calc(100% - 24px),820px);margin:auto}button,textarea{font:inherit}a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line);background:#070708}.head{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;letter-spacing:.05em}.siteid{color:var(--gold);font-size:.72rem;font-weight:900}
.hero{padding:26px 0 16px}.hero h1{margin:0;font-size:clamp(1.4rem,4.4vw,1.9rem);line-height:1.28;letter-spacing:.01em}.hero p{margin:8px 0 0;color:var(--soft);font-size:.78rem;line-height:1.8}.demo{margin-top:12px;padding:10px 12px;border-left:3px solid var(--gold);background:#0d0d0f;color:#cfc8bc;font-size:.72rem}
.card{margin:12px 0;border:1px solid rgba(217,174,92,.22);border-radius:16px;background:linear-gradient(145deg,#121214,#0b0b0c);overflow:hidden}.card h2{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.9rem}.body{padding:14px}.status{display:inline-flex;padding:6px 9px;border:1px solid rgba(217,174,92,.45);border-radius:999px;color:#efd59d;font-size:.69rem;font-weight:900}.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;margin-top:13px;font-size:.76rem}.kv b{color:var(--muted)}.preview{display:flex;align-items:center;justify-content:center;min-height:120px;border:1px dashed rgba(255,255,255,.16);border-radius:12px;background:#0b0b0c;text-align:center}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 15px;border:1px solid var(--line);border-radius:10px;background:#171719;color:#fff;font-weight:900;font-size:.77rem;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red)}.btn.publish{background:#143021;border-color:rgba(85,214,138,.45);color:#aaf0c7}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.note{width:100%;min-height:100px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#111;color:#fff;resize:vertical}.msg{margin-top:9px;color:#aaa;font-size:.7rem}.info{padding:13px;border-left:3px solid var(--gold);background:#0d0d0f;color:#d4d0c8;font-size:.76rem}.success{padding:13px;border:1px solid rgba(85,214,138,.3);background:rgba(85,214,138,.06);border-radius:12px;color:#aff0ca;font-size:.78rem}.danger{padding:13px;border:1px solid rgba(198,31,56,.35);background:rgba(198,31,56,.06);border-radius:12px;color:#f2c3ca;font-size:.78rem}.revision-panel{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0d0d0f}.revision-panel[hidden]{display:none}.revision-title{margin:0 0 8px;font-size:.78rem;font-weight:900}.revision-help{margin:0 0 9px;color:#aaa;font-size:.7rem}
@media(max-width:620px){.kv,.actions{grid-template-columns:1fr}.hero{padding-top:27px}}

.line-consult-wrap{margin-top:12px;padding:13px;border:1px solid rgba(217,174,92,.22);border-radius:12px;background:#0d0d0f;text-align:center}
.line-consult-copy{margin:0 0 9px;color:#aaa;font-size:.72rem}
.line-qr{display:none;justify-content:center;margin-top:10px}
.line-qr>div{padding:10px;background:#fff;border-radius:10px}
.line-qr canvas,.line-qr img{display:block;max-width:170px;height:auto}
@media(min-width:760px){.line-qr{display:flex}.line-mobile-note{display:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body>
<header><div class="wrap head"><div class="brand">SHO WEB SUPPORT</div><div class="siteid">SITE ID: <span id="siteId">----</span></div></div></header>
<main class="wrap">
<section class="hero"><h1>サイト確認</h1><p>制作したホームページをご確認ください。修正があれば送信し、問題なければ内容承認後にご自身で公開できます。</p><div class="demo">現在は承認フロー確認用のデモです。同じブラウザのSHO管理画面デモと状態が連動します。</div></section>
<div id="app"></div>
<section class="card"><h2>LINEで相談</h2><div class="body"><div class="line-consult-wrap" style="margin-top:0"><p class="line-consult-copy">修正内容や分からないことはLINEでも相談できます。SITE ID入りの文章が最初から入力されます。</p><a class="btn" id="lineConsult" href="#" target="_blank" rel="noopener">LINEで相談する</a><div class="line-qr"><div id="lineQr"></div></div><div class="msg line-mobile-note">スマホではボタンからLINEを開けます。</div><div class="msg">PCではQRコードをスマホで読み取ってください。</div></div></div></section>
</main>
<script type="module">
import { requireWebsiteSession, websiteApi } from './website-client.js';

(async()=>{
const KEY='sho-web-admin-demo-v2';
const params=new URLSearchParams(location.search);
const id=params.get('id')||'1042';
const prodMode=params.get('prod')==='1';
document.getElementById('siteId').textContent=id;
if(prodMode){
  document.querySelector('.demo').textContent='ログイン中のお客様専用画面です。SITE IDに紐づく制作状況を表示しています。';
  await requireWebsiteSession(location.href);
}

const lineMessage='SITE ID '+id+'です。ホームページについて相談したいです。';
document.getElementById('lineConsult').href='https://line.me/R/oaMessage/%40144dlsxp/?'+encodeURIComponent(lineMessage);
const lineUrl=document.getElementById('lineConsult').href;
if(window.QRCode&&document.getElementById('lineQr'))new QRCode(document.getElementById('lineQr'),{text:lineUrl,width:160,height:160,correctLevel:QRCode.CorrectLevel.M});

const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const now=()=>new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-');
const label=s=>({request_waiting:'要望待ち',building:'作成中',sho_review:'SHO確認中',customer_review:'お客様最終確認中',live:'公開中',private:'一時非公開',improving_private:'改良中・一時非公開'}[s]||s);

function demoLoad(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}}
function demoSave(s){localStorage.setItem(KEY,JSON.stringify(s))}

function action(p){
 if(p.status==='customer_review'&&!p.customerApproved){
  return '<div class="actions"><button class="btn" id="openRevision" type="button">修正を依頼する</button><button class="btn primary" id="approve" type="button">この内容でOK</button></div><div class="revision-panel" id="revisionPanel" hidden><p class="revision-title">修正してほしい内容を入力してください</p><p class="revision-help">箇条書きでも大丈夫です。気になる場所・変更したい文章・色・写真などを自由に書けます。</p><textarea class="note" id="revision" placeholder="例：トップの写真を2枚目に変更してほしい。見出しの赤を少し暗くしたい。"></textarea><div class="actions"><button class="btn" id="closeRevision" type="button">戻る</button><button class="btn primary" id="sendRevision" type="button">修正内容を送信</button></div></div><div class="msg">「この内容でOK」を押しても、まだ公開されません。続けて公開確認が表示されます。</div>';
 }
 if(p.status==='customer_review'&&p.customerApproved){
  return '<div class="success">サイト内容は承認済みです。公開して問題なければ、下のボタンで公開してください。</div><div class="actions" style="grid-template-columns:1fr"><button class="btn publish" id="publish" type="button">この内容で公開する</button></div><div class="msg">公開後も、必要に応じて一時非公開や改良対応ができます。</div>';
 }
 if(p.status==='live')return '<div class="success">このサイトは現在公開中です。</div>';
 if(p.status==='private')return '<div class="info">このサイトは現在、一時非公開です。</div>';
 if(p.status==='improving_private')return '<div class="info">現在、サイト改良のため一時非公開です。</div>';
 if(p.status==='building')return '<div class="info">現在サイトを作成・修正しています。完成後にSHOの確認を行い、その後こちらで最終確認できるようになります。</div>';
 if(p.status==='sho_review')return '<div class="info">現在SHOが制作内容を確認しています。確認完了後、この画面で最終確認できます。</div>';
 return '<div class="info">現在は要望入力待ちです。</div>';
}

async function loadProject(){
 if(prodMode){
  const result=await websiteApi('load_site',{site_id:id});
  const site=result?.site;
  if(!site)return null;
  return {
   id:site.site_id,
   name:site.site_name||'ホームページ',
   status:site.status,
   updated:site.updated_at?new Date(site.updated_at).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(/\//g,'-'):'',
   preview:site.preview_url||'',
   customerApproved:Boolean(site.customer_approved),
  };
 }
 const state=demoLoad();
 return state.find(x=>String(x.id)===String(id))||null;
}

async function render(){
 const app=document.getElementById('app');
 let p;
 try{p=await loadProject()}catch(error){console.error(error);app.innerHTML='<section class="card"><div class="body danger">サイト情報を読み込めませんでした。時間を置いて再度お試しください。</div></section>';return}
 if(!p){app.innerHTML='<section class="card"><div class="body">このSITE IDの案件が見つかりません。</div></section>';return}

 const previewHtml=p.preview
  ? '<a class="btn primary" href="'+esc(p.preview)+'" target="_blank" rel="noopener">プレビューを開く</a>'
  : '<span style="color:#777;font-size:.75rem">プレビュー準備中です</span>';

 app.innerHTML='<section class="card"><h2>現在の状態</h2><div class="body"><span class="status">'+esc(label(p.status))+'</span><div class="kv"><b>サイト名</b><span>'+esc(p.name)+'</span><b>最終更新</b><span>'+esc(p.updated)+'</span></div></div></section>'+
 '<section class="card"><h2>制作サイト</h2><div class="body"><div class="preview"><div><p style="margin:0 0 10px;color:#aaa;font-size:.76rem">別画面でサイトを確認できます</p>'+previewHtml+'</div></div></div></section>'+
 '<section class="card"><h2>確認・公開</h2><div class="body">'+action(p)+'</div></section>';
 bind(p);
}

function bind(p){
 const revisionPanel=document.getElementById('revisionPanel');
 document.getElementById('openRevision')?.addEventListener('click',()=>{
  if(revisionPanel){revisionPanel.hidden=false;document.getElementById('revision')?.focus();}
 });
 document.getElementById('closeRevision')?.addEventListener('click',()=>{
  if(revisionPanel)revisionPanel.hidden=true;
 });
 document.getElementById('sendRevision')?.addEventListener('click',async(e)=>{
  const btn=e.currentTarget,t=document.getElementById('revision').value.trim();
  if(!t)return alert('修正内容を入力してください。');
  if(btn.disabled)return;btn.disabled=true;btn.textContent='送信中…';
  if(prodMode){
   try{await websiteApi('review_action',{site_id:id,review_action:'revision',detail:t});await render()}catch(error){btn.disabled=false;btn.textContent='修正内容を送信';alert(error.message||'送信できませんでした。')}
   return;
  }
  const state=demoLoad(),target=state.find(x=>String(x.id)===String(id));if(!target)return;
  target.status='building';target.customerApproved=false;target.current='お客様から修正依頼。再作成中。';target.updated=now();target.notes=target.notes||[];target.notes.unshift({at:target.updated,title:'お客様から修正依頼',text:t});demoSave(state);render();
 });

 document.getElementById('approve')?.addEventListener('click',async(e)=>{
  if(!confirm('サイト内容を承認しますか？まだ公開はされません。'))return;
  const btn=e.currentTarget;if(btn.disabled)return;btn.disabled=true;btn.textContent='承認中…';
  if(prodMode){
   try{await websiteApi('review_action',{site_id:id,review_action:'approve'});await render()}catch(error){btn.disabled=false;btn.textContent='この内容でOK';alert(error.message||'承認できませんでした。')}
   return;
  }
  const state=demoLoad(),target=state.find(x=>String(x.id)===String(id));if(!target)return;
  target.customerApproved=true;target.updated=now();target.notes=target.notes||[];target.notes.unshift({at:target.updated,title:'お客様が内容承認',text:'最終確認OK。公開操作待ち。'});demoSave(state);render();
 });

 document.getElementById('publish')?.addEventListener('click',async(e)=>{
  if(!confirm('この内容でサイトを公開しますか？'))return;
  const btn=e.currentTarget;if(btn.disabled)return;btn.disabled=true;btn.textContent='公開中…';
  if(prodMode){
   try{await websiteApi('review_action',{site_id:id,review_action:'publish'});await render()}catch(error){btn.disabled=false;btn.textContent='この内容で公開する';alert(error.message||'公開できませんでした。')}
   return;
  }
  const state=demoLoad(),target=state.find(x=>String(x.id)===String(id));if(!target)return;
  target.status='live';target.customerApproved=false;target.current='サイト公開中。';target.updated=now();target.notes=target.notes||[];target.notes.unshift({at:target.updated,title:'お客様が公開',text:'お客様の公開操作で公開中へ移行。'});demoSave(state);render();
 });
}

await render();
})();
</script>
</body>
</html>
