<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>パスワード設定 | SHO WEB SUPPORT</title><link rel="stylesheet" href="website-theme.css">
<style>*{box-sizing:border-box}body{margin:0;background:#080809;color:#fff;font:15px/1.7 system-ui,sans-serif}.wrap{max-width:580px;margin:0 auto;padding:32px 18px}h1{font-size:clamp(1.6rem,6vw,2.6rem);margin:12px 0}.sub{color:#bbb}.card{border:1px solid #4a3b25;border-radius:14px;padding:18px;background:#111}label{display:block;margin:12px 0;font-weight:700}input{display:block;width:100%;font:inherit;color:#fff;background:#080808;border:1px solid #555;border-radius:9px;padding:12px;margin-top:6px}.btn{width:100%;background:#bd1c39;color:#fff;border:0;border-radius:9px;padding:13px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.msg{color:#ebca85;white-space:pre-wrap;font-size:.83rem}.foot{font-size:.77rem;color:#999;margin-top:18px}a{color:#e2ba76}</style></head>
<body><main class="wrap"><small style="color:#d9ae5c">SHO WEB SUPPORT / ACCOUNT</small><h1>パスワード設定・変更</h1><p class="sub">すでにログイン済みの方だけが利用できます。登録済みのユーザー情報・SITE IDは維持されます。</p><section class="card">
<form id="settingsForm"><label>新しいパスワード<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>新しいパスワード（確認）<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button type="submit" class="btn" id="save">パスワードを設定する</button></form><p class="msg" id="message" role="status"></p><p class="foot">12文字以上を推奨。名前・誕生日・他サービスで使っているものは避けてください。パスワードをチャットやLINEで送信しないでください。</p>
</section><p><a href="website-portal.html">お客様マイページへ戻る</a></p></main>
<script type="module">
import {websiteSupabase,currentSession} from './website-client.js';
const form=document.getElementById('settingsForm'),message=document.getElementById('message'),save=document.getElementById('save');
let active=false;
try{active=!!(await currentSession());}catch{}
if(!active){form.hidden=true;message.textContent='ログインが必要です。既存アカウントの初回設定は運営者からご案内します。';}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(p.length<12||p!==c){message.textContent='12文字以上で、確認欄と一致するパスワードを入力してください。';return;}
 save.disabled=true;message.textContent='設定しています…';
 try{
  const {error}=await websiteSupabase.auth.updateUser({password:p});
  if(error)throw error;
  form.reset();message.textContent='パスワードを設定しました。次回からメールアドレスと新しいパスワードでログインできます。';
 }catch(error){
  message.textContent=error?.message==='New password should be different from the old password'?'以前とは異なるパスワードを設定してください。':'設定できませんでした。最近のログインが必要な場合や認証設定が原因の可能性があります。';
 }finally{save.disabled=false;}
});
</script></body></html>
