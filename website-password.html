<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>パスワード設定 | SHO WEB SUPPORT</title><link rel="stylesheet" href="website-theme.css">
<style>*{box-sizing:border-box}body{margin:0;background:#080809;color:#fff;font:15px/1.7 system-ui,sans-serif}.wrap{max-width:580px;margin:0 auto;padding:32px 18px}h1{font-size:clamp(1.6rem,6vw,2.6rem);margin:12px 0}.sub{color:#bbb}.card{border:1px solid #4a3b25;border-radius:14px;padding:18px;background:#111}label{display:block;margin:12px 0;font-weight:700}input{display:block;width:100%;font:inherit;color:#fff;background:#080808;border:1px solid #555;border-radius:9px;padding:12px;margin-top:6px}.btn{width:100%;background:#bd1c39;color:#fff;border:0;border-radius:9px;padding:13px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.msg{color:#ebca85;white-space:pre-wrap;font-size:.83rem}.foot{font-size:.77rem;color:#999;margin-top:18px}a{color:#e2ba76}</style></head>
<body><main class="wrap"><small style="color:#d9ae5c">SHO WEB SUPPORT / ACCOUNT</small><h1>パスワード設定・変更</h1><p class="sub">ログイン済みの方、またはメールの再設定リンクからアクセスした方が設定できます。注文・SITE IDなどの情報はそのまま維持されます。</p><section class="card">
<form id="settingsForm"><label>新しいパスワード<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>新しいパスワード（確認）<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button type="submit" class="btn" id="save">パスワードを設定する</button></form><p class="msg" id="message" role="status"></p><p class="foot">12文字以上を推奨。名前・誕生日・他サービスで使っているものは避けてください。パスワードをチャットやLINEで送信しないでください。</p>
</section><p><a id="returnLogin" href="website-login.html">← ログイン画面に戻る</a></p></main>
<script type="module">
import {websiteSupabase,currentSession} from './website-client.js';
const form=document.getElementById('settingsForm'),message=document.getElementById('message'),save=document.getElementById('save');
const params=new URLSearchParams(location.search);
const isRecovery=params.get('mode')==='recovery';
const requested=params.get('next');
const safeNext=(()=>{
  const fallback=new URL('website-portal.html',location.href).href;
  if(!requested)return fallback;
  try{const u=new URL(requested,location.href);return u.origin===location.origin&&u.protocol==='https:'?u.href:fallback}catch{return fallback}
})();
const login=new URL('website-login.html',location.href);
login.searchParams.set('next',safeNext);
document.getElementById('returnLogin').href=login.href;
if(isRecovery){
  document.title='パスワード再設定 | SHO WEB SUPPORT';
  document.querySelector('h1').textContent='新しいパスワードを登録';
}
const originalFragment=new URLSearchParams(location.hash.replace(/^#/,''));
const authError=originalFragment.get('error_description')||originalFragment.get('error');
let active=false;
let recovered=false;
websiteSupabase.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session)recovered=true;
});
try{
  const session=await currentSession();
  active=!!session;
  if(authError)throw new Error('リンクが無効または期限切れです。再設定メールを新しく送信してください。');
  if(!active)throw new Error(isRecovery?'再設定リンクからログインできませんでした。リンクが期限切れの場合は、再設定メールを再送してください。':'ログインが必要です。ログイン画面からアクセスしてください。');
  const {data,error}=await websiteSupabase.auth.getUser();
  if(error||!data?.user)throw new Error('本人確認ができませんでした。再度ログインしてください。');
  message.textContent='設定対象：'+(data.user.email||'ログイン中のアカウント');
}catch(error){
  form.hidden=true;
  message.textContent=error.message||'ログイン状態を確認できませんでした。';
  const link=document.createElement('a');
  link.href=new URL('website-recover.html?next='+encodeURIComponent(safeNext),location.href).href;
  link.textContent='再設定メールをもう一度送信する →';
  link.style.display='block';link.style.marginTop='12px';
  message.appendChild(link);
}
form.addEventListener('submit',async e=>{
 e.preventDefault();
 if(!active)return;
 const p=document.getElementById('password').value,c=document.getElementById('confirm').value;
 if(p.length<12||p!==c){message.textContent='12文字以上で、確認欄と一致するパスワードを入力してください。';return;}
 save.disabled=true;message.textContent='設定しています…';
 try{
  const {error}=await websiteSupabase.auth.updateUser({password:p});
  if(error)throw error;
  form.reset();
  form.hidden=true;
  if(isRecovery){
    await websiteSupabase.auth.signOut();
    message.textContent='パスワードを再設定しました。新しいパスワードでログインしてください。';
  }else{
    message.textContent='パスワードを変更しました。次回から新しいパスワードでログインできます。';
  }
  const link=document.createElement('a');
  link.href=login.href;link.textContent='ログイン画面へ進む →';
  link.style.display='block';link.style.marginTop='12px';
  message.appendChild(link);
 }catch(error){
  if(/same password|different from the old/i.test(String(error?.message||''))){
    message.textContent='以前と異なるパスワードを設定してください。';
  }else if(error?.status===429){
    message.textContent='操作回数制限中です。時間を置いてやり直してください。';
  }else{
    message.textContent='パスワードを設定できませんでした。再度リンクからお試しください。';
  }
 }finally{save.disabled=false;}
});
</script></body></html>
