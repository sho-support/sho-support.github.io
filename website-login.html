<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070707">
<title>ログイン | SHO WEB SUPPORT</title>
<link rel="stylesheet" href="website-theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{width:min(calc(100% - 24px),560px);margin:auto}.hero{padding:48px 0 20px}.hero h1{margin:0;font-size:clamp(2.3rem,9vw,4rem);line-height:1}.hero p{color:#c8c8c8}.card{padding:18px;border:1px solid rgba(217,174,92,.24);border-radius:14px;background:#0d0d0f}label{display:block;font-weight:800;font-size:.8rem}input{width:100%;margin-top:8px;padding:13px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#111;color:#fff;font-size:16px}.btn{width:100%;margin-top:12px;border:0;border-radius:10px;padding:13px;background:#c51f38;color:#fff;font-weight:900}.msg{margin:10px 0 0;color:#aaa;font-size:.75rem}.note{margin-top:14px;color:#8e8e93;font-size:.7rem;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div style="color:#d9ae5c;font-weight:900;font-size:.75rem">SHO WEB SUPPORT</div><h1 id="loginHeading">ログイン</h1><p id="loginIntro">登録済みのメールアドレスとパスワードでログインします。</p></section>
<section class="card">
<form id="loginForm"><label>メールアドレス<input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="you@example.com"></label><label style="margin-top:14px">パスワード<input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="パスワードを入力"></label><button class="btn" id="loginBtn" type="submit">ログインする</button></form><p class="note"><a id="forgotPassword" href="website-recover.html" style="color:#e4b96a;font-weight:800">パスワードを忘れた方・初回パスワード未設定の方 →</a><br>登録済みのメールアドレスへ再設定リンクを送信します。<br>新しいアカウントの登録は、制作申込み後の案内に従って行います。登録されていない方は再設定だけでは利用開始できません。</p>
<p class="msg" id="message"></p>
<div class="note" id="loginNote">ログイン先に応じて、利用可能なページを表示します。</div>
</section>
</main>
<script type="module" src="website-login.js"></script>
</body>
</html>
