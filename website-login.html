<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070707">
<title>Customer Login | SHO WEB SUPPORT</title>
<link rel="stylesheet" href="website-theme.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.wrap{width:min(calc(100% - 24px),560px);margin:auto}.hero{padding:48px 0 20px}.hero h1{margin:0;font-size:clamp(2.3rem,9vw,4rem);line-height:1}.hero p{color:#c8c8c8}.card{padding:18px;border:1px solid rgba(217,174,92,.24);border-radius:14px;background:#0d0d0f}label{display:block;font-weight:800;font-size:.8rem}input{width:100%;margin-top:8px;padding:13px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#111;color:#fff;font-size:16px}.btn{width:100%;margin-top:12px;border:0;border-radius:10px;padding:13px;background:#c51f38;color:#fff;font-weight:900}.msg{margin:10px 0 0;color:#aaa;font-size:.75rem}.note{margin-top:14px;color:#8e8e93;font-size:.7rem;line-height:1.7}
</style>
</head>
<body>
<main class="wrap">
<section class="hero"><div style="color:#d9ae5c;font-weight:900;font-size:.75rem">SHO WEB SUPPORT</div><h1>お客様ログイン</h1><p>登録したメールアドレスへログインリンクを送ります。パスワードは不要です。</p></section>
<section class="card">
<form id="loginForm"><label>メールアドレス<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn" id="loginBtn" type="submit">ログインリンクを受け取る</button></form>
<p class="msg" id="message"></p>
<div class="note">ログイン後は、自分が参加しているSITE IDだけが表示されます。同じサイトを複数人で編集する場合は、それぞれのメールアドレスを同じSITE IDへ追加できます。</div>
</section>
</main>
<script type="module" src="website-login.js"></script>
</body>
</html>
