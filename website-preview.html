<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070707">
<title>制作サイトの確認 | SHO WEB SUPPORT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080808;color:#eee;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 17px;background:#101013;border-bottom:1px solid #333}.top strong{font-size:.81rem;letter-spacing:.06em}.top span{font-size:.72rem;color:#bbb}.top a{margin-left:auto;color:#f0b87c;font-size:.78rem}.state{padding:26px;text-align:center;color:#ccc;font-size:.83rem}.error{color:#ffd0d4}iframe{display:block;border:0;width:100%;height:calc(100dvh - 58px);background:#fff}#view[hidden]{display:none}@media(max-width:600px){.top{gap:6px}.top strong{font-size:.72rem}.top span{font-size:.65rem}iframe{height:calc(100dvh - 65px)}} 
</style>
</head>
<body>
<div class="top"><strong>SHO WEB SUPPORT / PREVIEW</strong><span>公開前の制作確認画面</span><a href="website-support.html" target="_blank" rel="noopener noreferrer">制作サービス</a></div>
<div class="state" id="status" role="status" aria-live="polite">制作ページを読み込み中です…</div>
<iframe id="view" title="制作サイトのプレビュー" sandbox="allow-scripts allow-forms allow-popups" referrerpolicy="no-referrer" hidden></iframe>
<script>
(async()=>{
const state=document.getElementById('status'),frame=document.getElementById('view');
const u=new URL(location.href),id=u.searchParams.get('id')||'',key=u.searchParams.get('key')||'';
const path=u.searchParams.get('path')||'index.html';
const edge='https://tyhymvgjkoebetyypspj.supabase.co/functions/v1/website-preview';
const api=(file)=>edge+'?id='+encodeURIComponent(id)+'&key='+encodeURIComponent(key)+'&path='+encodeURIComponent(file);
function safeLocal(raw){
 try{
  const target=new URL(raw,location.href),base=new URL(edge);
  return target.origin===base.origin&&target.pathname===base.pathname&&target.searchParams.get('id')===id&&target.searchParams.get('key')===key;
 }catch{return false}
}
function sourcePath(raw){
 const value=String(raw||'').trim().replaceAll('&amp;','&');
 if(!value||/^(?:data:|blob:|#|javascript:|mailto:|tel:)/i.test(value))return null;
 const validFile=file=>Boolean(file)&&file.length<=300&&!file.startsWith('/')&&!file.split('/').some(p=>p==='.'||p==='..'||p.startsWith('.git'))&&!file.startsWith('docs/');
 try{
  // The Edge Function rewrites relative asset references to signed, first-party URLs.
  // Canonicalize these URLs with this viewer's current access key; never leave a
  // private preview asset pointed at the cross-origin endpoint inside srcdoc.
  const target=new URL(value,location.href),base=new URL(edge);
  if(target.origin===base.origin&&target.pathname===base.pathname){
   const file=target.searchParams.get('path')||'';
   return validFile(file)?api(file):null;
  }
 }catch{return null}
 if(/^(?:https?:|\/\/)/i.test(value))return null;
 try{
  const target=new URL(value,'https://preview.local/'+path);
  if(target.origin!=='https://preview.local')return null;
  const file=decodeURIComponent(target.pathname.slice(1));
  return validFile(file)?api(file):null;
 }catch{return null}
}
async function getAsset(url){
 const response=await fetch(url,{cache:'no-store',referrerPolicy:'no-referrer'});
 if(response.status===403)throw Error('このプレビューURLは無効になりました。制作管理画面を再読み込みして最新のプレビューを開いてください。お客様はLINEで届いた最新の確認URLをご利用ください。');
 if(!response.ok)throw Error('プレビューの読み込みに失敗しました（HTTP '+response.status+'）。');
 return response;
}
async function asDataURL(response){
 const blob=await response.blob();
 if(blob.size>8_000_000)throw Error('画像サイズが上限を超えています。');
 // Reject a JSON/error payload incorrectly returned as image/png (HTTP 200 alone
 // does not prove the bytes are an image).
 if(blob.type==='image/png'){
  const b=new Uint8Array(await blob.slice(0,8).arrayBuffer());
  if(b.length<8||b[0]!==137||b[1]!==80||b[2]!==78||b[3]!==71||b[4]!==13||b[5]!==10||b[6]!==26||b[7]!==10)
   throw Error('PNG画像ではない応答を受信しました');
 }
 return new Promise((resolve,reject)=>{
  const fr=new FileReader();fr.onload=()=>resolve(String(fr.result));fr.onerror=()=>reject(fr.error);fr.readAsDataURL(blob);
 });
}
try{
 if(!/^[A-Za-z0-9_-]{3,32}$/.test(id)||!/^[-_A-Za-z0-9]{20,200}$/.test(key))throw Error('プレビューURLが無効です。LINEで届いた最新のURLから開いてください。');
 const response=await getAsset(api(path));
 const data=await response.json().catch(()=>null);
 if(typeof data?.html!=='string')throw Error('制作ページを読み込めませんでした。URLの期限か通信環境を確認してください。');
 const doc=new DOMParser().parseFromString(data.html,'text/html');
 for(const el of doc.querySelectorAll('base'))el.remove();
 const issues=[];
 const styles=[...doc.querySelectorAll('link[rel~="stylesheet"][href]')];
 for(const el of styles){
  const raw=el.getAttribute('href'),target=sourcePath(raw);
  if(!target)continue;
  try{
   const asset=await getAsset(target),css=await asset.text();
   if(css.trim().startsWith('<!doctype')||css.trim().startsWith('<html'))throw Error('CSSではなくHTMLが返されました。');
   const style=doc.createElement('style');
   style.textContent=css;
   el.replaceWith(style);
  }catch(err){issues.push('スタイル: '+(raw||'')+' ('+String(err.message||err)+')');}
 }
 const images=[...doc.querySelectorAll('img[src],source[src],video[poster],link[rel~="icon"][href]')];
 for(const el of images){
  const attr=el.hasAttribute('src')?'src':el.hasAttribute('poster')?'poster':'href';
  const raw=el.getAttribute(attr),target=sourcePath(raw);
  if(!target){if(/^https?:\/\/tyhymvgjkoebetyypspj\.supabase\.co\/functions\/v1\/website-preview/i.test(String(raw||'')))issues.push('画像URLを解決できません: '+String(raw).split('?')[0]);continue;}
  try{el.setAttribute(attr,await asDataURL(await getAsset(target)));}
  catch(err){issues.push('画像: '+(raw||'')+' ('+String(err.message||err)+')');}
 }
 // Use the fallback <img> instead of source sets that may be blocked by opaque iframe origins.
 for(const el of doc.querySelectorAll('source[srcset]'))el.removeAttribute('srcset');
 for(const el of doc.querySelectorAll('img[srcset]'))el.removeAttribute('srcset');
 const scripts=[...doc.querySelectorAll('script[src]')];
 for(const el of scripts){
  const raw=el.getAttribute('src'),target=sourcePath(raw);
  if(!target)continue;
  try{
   const source=await (await getAsset(target)).text();
   const inline=doc.createElement('script');
   for(const attr of el.attributes){if(attr.name!=='src'&&attr.name!=='integrity'&&attr.name!=='crossorigin')inline.setAttribute(attr.name,attr.value);}
   inline.textContent=source.replace(/<\/script/gi,'<\\/script');
   el.replaceWith(inline);
  }catch(err){issues.push('動作ファイル: '+(raw||'')+' ('+String(err.message||err)+')');}
 }
 const html='<!doctype html>\n'+doc.documentElement.outerHTML;
 frame.srcdoc=html;
 frame.hidden=false;state.hidden=true;
 if(issues.length){
   const warning=document.createElement('div');
   warning.className='state error';
   warning.style.cssText='border-bottom:1px solid #793640;text-align:left;font-size:13px;padding:12px 17px';
   warning.textContent='制作ページの一部を読み込めません。運営へ修正を依頼してください。('+issues.length+'件)';
   document.querySelector('.top').after(warning);
   console.warn('Preview assets failed:',issues);
 }
}catch(e){state.classList.add('error');state.textContent=e.message||'プレビューを表示できませんでした。';}
})();
</script>
</body></html>
