<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#070707"><title>パスワード再設定 | SHO WEB SUPPORT</title><link rel="stylesheet" href="website-theme.css">
<style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font:15px/1.7 system-ui,sans-serif}.wrap{max-width:560px;margin:0 auto;padding:45px 18px}.eyebrow{color:#d9ae5c;font-size:.75rem;font-weight:900}h1{margin:12px 0;font-size:clamp(1.8rem,6vw,2.9rem)}.sub{color:#c4c4c4}.card{background:#101012;border:1px solid #4a3b25;border-radius:14px;padding:20px}label{display:block;font-size:.84rem;font-weight:800;margin-bottom:12px}input{display:block;width:100%;font:inherit;padding:13px;color:#fff;background:#111;border:1px solid #555;border-radius:9px;margin-top:7px}.btn{width:100%;background:#bc1937;color:white;padding:13px;border:0;border-radius:9px;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}.msg{margin-top:13px;white-space:pre-wrap;color:#e5c384;font-size:.82rem}a{color:#e5c384}.note{color:#999;font-size:.74rem;margin-top:15px}</style></head>
<body><main class="wrap"><div class="eyebrow">SHO WEB SUPPORT / ACCOUNT</div><h1>パスワードを再設定</h1><p class="sub">登録済みのメールアドレスを入力してください。</p>
<section class="card"><form id="recoverForm"><label>登録済みメールアドレス<input type="email" id="email" autocomplete="email" placeholder="you@example.com" required></label><button class="btn" type="submit" id="send">再設定メールを送信する</button></form><p id="message" class="msg" role="status" aria-live="polite"></p><p class="note">再設定メールが届かない場合は迷惑メールフォルダを確認してください。<br>登録されていないアドレスでも、アカウント保護のため同じご案内が表示されることがあります。</p></section>
<p><a id="back" href="website-login.html">← ログインに戻る</a></p></main><script type="module" src="website-recover.js"></script></body></html>
